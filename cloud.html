<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>pCloud - Secure Cloud Storage</title>
  <style>
    :root {
      --primary: #1890ff;
      --primary-hover: #40a9ff;
      --bg-main: #f4f7fc;
      --sidebar-bg: #111c24;
      --sidebar-hover: #1e2d3b;
      --text-main: #2c3e50;
      --text-muted: #8c9ba5;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --danger: #ff4d4f;
      --success: #2ecc71;
      --warning: #f1c40f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      display: flex;
      height: 100vh;
      background-color: var(--bg-main);
      color: var(--text-main);
      overflow: hidden;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background-color: var(--sidebar-bg);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 16px;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 20px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 12px;
      padding-left: 8px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background-color: var(--primary);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    /* Server Status Indicator */
    .server-status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 8px 24px 8px;
      font-size: 13px;
      color: var(--text-muted);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 24px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--warning);
      box-shadow: 0 0 8px rgba(0,0,0,0.5);
      transition: background-color 0.3s;
    }

    .status-dot.online { background-color: var(--success); box-shadow: 0 0 8px rgba(46, 204, 113, 0.6); }
    .status-dot.offline { background-color: var(--danger); box-shadow: 0 0 8px rgba(255, 77, 79, 0.6); }

    .nav-menu {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 8px;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: 500;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    .nav-item:hover, .nav-item.active {
      background-color: var(--sidebar-hover);
      color: #ffffff;
    }

    .nav-item.active {
      border-left: 4px solid var(--primary);
    }

    /* Storage Indicator Card */
    .storage-card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .storage-title {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .storage-bar-bg {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .storage-bar-fill {
      height: 100%;
      width: 0%;
      background-color: var(--primary);
      border-radius: 3px;
      transition: width 0.4s ease;
    }

    .storage-text {
      font-size: 13px;
      color: #ffffff;
      font-weight: 600;
    }

    /* Main Area */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Navigation Header */
    .header {
      height: 70px;
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .search-box {
      width: 260px;
      position: relative;
    }

    .search-input {
      width: 100%;
      padding: 10px 16px 10px 40px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      background-color: #f8fafc;
      font-size: 14px;
      outline: none;
      transition: border 0.2s;
    }

    .search-input:focus {
      border-color: var(--primary);
      background-color: #ffffff;
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
    }

    /* Server URL Config */
    .server-config {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #f8fafc;
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
    }

    .server-config label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .server-config input {
      border: none;
      background: transparent;
      outline: none;
      font-size: 13px;
      width: 180px;
      color: var(--text-main);
    }
    
    .server-config button {
      background: var(--sidebar-bg);
      color: white;
      border: none;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
    }

    .server-config button:hover {
      background: var(--sidebar-hover);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn-upload {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      transition: background 0.2s;
    }

    .btn-upload:hover {
      background-color: var(--primary-hover);
    }

    .user-profile {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: var(--text-main);
    }

    /* Content Area */
    .content {
      padding: 32px;
      overflow-y: auto;
      flex: 1;
    }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    /* Drag and Drop Zone */
    .drop-zone {
      border: 2px dashed var(--primary);
      border-radius: 12px;
      padding: 24px;
      text-align: center;
      background: #f0f7ff;
      color: var(--primary);
      margin-bottom: 24px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .drop-zone:hover {
      background: #e6f0fa;
    }

    /* File Grid */
    .file-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }

    .file-card {
      background-color: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .file-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.05);
    }

    .file-icon {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .file-name {
      font-size: 14px;
      font-weight: 600;
      width: 100%;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .file-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .file-actions {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .btn-action {
      flex: 1;
      padding: 6px 0;
      border: 1px solid var(--border-color);
      background: #ffffff;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      color: var(--text-main);
      text-decoration: none;
      text-align: center;
      transition: background 0.2s;
    }

    .btn-action:hover {
      background: #f8fafc;
    }

    .btn-action.delete {
      color: var(--danger);
      border-color: #ffa39e;
    }

    .btn-action.delete:hover {
      background: #fff1f0;
    }

    .empty-state {
      text-align: center;
      padding: 60px 0;
      color: var(--text-muted);
      grid-column: 1 / -1;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <div>
      <div class="brand">
        <div class="brand-icon">☁️</div>
        <span>pCloud</span>
      </div>
      
      <!-- New Server Status Indicator -->
      <div class="server-status">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Checking Connection...</span>
      </div>

      <ul class="nav-menu">
        <li class="nav-item active">📁 My Drive</li>
        <li class="nav-item">⭐ Favorites</li>
        <li class="nav-item">👥 Shared</li>
        <li class="nav-item">🕒 Recent Files</li>
        <li class="nav-item">🗑️ Trash</li>
      </ul>
    </div>

    <div class="storage-card">
      <div class="storage-title">Storage Space</div>
      <div class="storage-bar-bg">
        <div class="storage-bar-fill" id="storageFill"></div>
      </div>
      <div class="storage-text" id="storageText">0 MB / 10 GB</div>
    </div>
  </div>

  <div class="main-content">
    <div class="header">
      <div class="header-left">
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input type="text" class="search-input" id="searchInput" placeholder="Search files..." oninput="filterFiles()">
        </div>

        <!-- Dynamic Server URL Configuration -->
        <div class="server-config">
          <label for="serverUrlInput">API:</label>
          <input type="text" id="serverUrlInput" value="http://192.168.8.20:8080" placeholder="e.g., http://localhost:8080">
          <button onclick="updateServerUrl()">Connect</button>
        </div>
      </div>

      <div class="header-actions">
        <label class="btn-upload">
          <span>⬆️ Upload File</span>
          <input type="file" id="fileInput" hidden onchange="uploadFile()">
        </label>
        <div class="user-profile">U</div>
      </div>
    </div>

    <div class="content">
      <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        📁 Drag & Drop files here or click to browse
      </div>

      <h2 class="section-title">All Files</h2>

      <div class="file-grid" id="fileGrid">
        <div class="empty-state">Checking server connection...</div>
      </div>
    </div>
  </div>

  <script>
    let SERVER_URL = document.getElementById('serverUrlInput').value;
    let localFiles = [];
    
    // Check server status
    async function checkServerStatus() {
      const statusDot = document.getElementById('statusDot');
      const statusText = document.getElementById('statusText');
      
      statusDot.className = 'status-dot'; // Resets to yellow warning color
      statusText.innerText = 'Connecting...';

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 4000); // 4 second timeout
        
        // A simple fetch to see if backend responds
        const response = await fetch(`${SERVER_URL}/api/files`, { 
          method: 'GET',
          signal: controller.signal,
          headers: { 'Accept': 'application/json' }
        });
        
        clearTimeout(timeoutId);

        if (response.ok) {
          statusDot.className = 'status-dot online';
          statusText.innerText = 'Server Online';
          return true;
        } else {
          throw new Error('Server returned an error');
        }
      } catch (error) {
        statusDot.className = 'status-dot offline';
        statusText.innerText = 'Server Offline';
        return false;
      }
    }

    // Triggered when user clicks "Connect" next to the URL input
    async function updateServerUrl() {
      SERVER_URL = document.getElementById('serverUrlInput').value.trim();
      // Remove trailing slash if user added one
      if (SERVER_URL.endsWith('/')) {
        SERVER_URL = SERVER_URL.slice(0, -1);
      }
      await loadFiles();
    }

    // Fetch and display file listings
    async function loadFiles() {
      const isOnline = await checkServerStatus();
      const grid = document.getElementById('fileGrid');

      if (!isOnline) {
        grid.innerHTML = `
          <div class="empty-state" style="color: var(--danger);">
            <strong>Connection Failed.</strong><br><br>
            Cannot reach backend at: <code>${SERVER_URL}</code><br>
            If using GitHub Pages, ensure your server is using HTTPS (e.g., via ngrok)<br>
            and CORS is enabled in your Node.js code.
          </div>`;
        return;
      }

      try {
        const response = await fetch(`${SERVER_URL}/api/files`);
        const data = await response.json();
        localFiles = data.files || [];
        updateStorageMeter(parseFloat(data.totalUsedMB || 0));
        renderFiles(localFiles);
      } catch (error) {
        console.error('Error connecting to backend:', error);
      }
    }

    // Render cards
    function renderFiles(files) {
      const grid = document.getElementById('fileGrid');
      grid.innerHTML = '';

      if (files.length === 0) {
        grid.innerHTML = `<div class="empty-state">No files uploaded yet. Drag or select a file to get started.</div>`;
        return;
      }

      files.forEach(file => {
        const icon = getFileIcon(file.name);
        const card = document.createElement('div');
        card.className = 'file-card';
        card.innerHTML = `
          <div class="file-icon">${icon}</div>
          <div class="file-name" title="${file.name}">${file.name}</div>
          <div class="file-meta">${file.size || 'Unknown size'} • ${file.date || 'Unknown date'}</div>
          <div class="file-actions">
            <a href="${SERVER_URL}/download/${encodeURIComponent(file.name)}" download class="btn-action">Download</a>
            <button onclick="deleteFile('${file.name}')" class="btn-action delete">Delete</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    // Storage calculation (Target limit: 10 GB)
    function updateStorageMeter(usedMB) {
      const totalGB = 10;
      const totalMB = totalGB * 1024;
      const percent = Math.min(((usedMB / totalMB) * 100), 100).toFixed(1);
      
      document.getElementById('storageFill').style.width = `${percent}%`;
      document.getElementById('storageText').innerText = `${usedMB} MB / ${totalGB} GB`;
    }

    // File Upload Handler
    async function uploadFile(fileObj = null) {
      const input = document.getElementById('fileInput');
      const file = fileObj || input.files[0];
      if (!file) return;

      const isOnline = await checkServerStatus();
      if (!isOnline) {
        alert('Cannot upload. Server is currently offline.');
        return;
      }

      const formData = new FormData();
      formData.append('file', file);

      try {
        const res = await fetch(`${SERVER_URL}/api/upload`, {
          method: 'POST',
          body: formData
        });

        if (res.ok) {
          input.value = '';
          loadFiles();
        } else {
          alert('Upload failed.');
        }
      } catch (err) {
        alert(`Could not send upload request to backend server at ${SERVER_URL}`);
      }
    }

    // Delete File Handler
    async function deleteFile(filename) {
      if (!confirm(`Are you sure you want to delete "${filename}"?`)) return;

      const isOnline = await checkServerStatus();
      if (!isOnline) {
        alert('Cannot delete. Server is currently offline.');
        return;
      }

      try {
        const res = await fetch(`${SERVER_URL}/api/files/${encodeURIComponent(filename)}`, {
          method: 'DELETE'
        });

        if (res.ok) {
          loadFiles();
        } else {
          alert('Delete failed.');
        }
      } catch (err) {
        alert('Could not communicate with backend server.');
      }
    }

    // Search Filter
    function filterFiles() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = localFiles.filter(f => f.name.toLowerCase().includes(query));
      renderFiles(filtered);
    }

    // File Type Helper
    function getFileIcon(filename) {
      const ext = filename.split('.').pop().toLowerCase();
      if (['png', 'jpg', 'jpeg', 'gif', 'svg', 'webp'].includes(ext)) return '🖼️';
      if (['mp4', 'mkv', 'mov', 'avi'].includes(ext)) return '🎥';
      if (['mp3', 'wav', 'flac'].includes(ext)) return '🎵';
      if (['pdf'].includes(ext)) return '📕';
      if (['zip', 'rar', '7z', 'tar', 'gz'].includes(ext)) return '📦';
      if (['txt', 'md', 'doc', 'docx'].includes(ext)) return '📝';
      return '📄';
    }

    // Drag and Drop Events
    const dropZone = document.getElementById('dropZone');
    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => { e.preventDefault(); dropZone.style.background = '#d0e4ff'; }, false);
    });
    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => { e.preventDefault(); dropZone.style.background = '#f0f7ff'; }, false);
    });
    dropZone.addEventListener('drop', (e) => {
      const files = e.dataTransfer.files;
      if (files.length > 0) uploadFile(files[0]);
    });

    // Initialize on load
    loadFiles();
    
    // Check server status every 15 seconds passively
    setInterval(checkServerStatus, 15000);
  </script>
</body>
  </html>
