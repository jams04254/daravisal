<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All-in-One Digital Clock</title>
    
    <!-- CSS for styling the clock -->
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #121212; /* Dark theme background */
            color: #00ffcc; /* Neon text color */
            font-family: 'Courier New', Courier, monospace;
        }

        .clock-container {
            background: #1e1e1e;
            padding: 2rem 4rem;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
            text-align: center;
        }

        #time {
            font-size: 4rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin: 0;
        }

        #date {
            font-size: 1.2rem;
            color: #888;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- HTML structure for the clock -->
    <div class="clock-container">
        <p id="time">00:00:00</p>
        <p id="date">Loading date...</p>
    </div>

    <!-- JavaScript for the clock logic -->
    <script>
        function updateClock() {
            const now = new Date();

            // Format Time (forces 2 digits, e.g., 09 instead of 9)
            let hours = String(now.getHours()).padStart(2, '0');
            let minutes = String(now.getMinutes()).padStart(2, '0');
            let seconds = String(now.getSeconds()).padStart(2, '0');
            
            // Inject time into the HTML
            document.getElementById('time').textContent = `${hours}:${minutes}:${seconds}`;

            // Format and inject Date
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString(undefined, options);
        }

        // Run immediately to avoid 1-second delay, then update every 1000ms
        updateClock();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
