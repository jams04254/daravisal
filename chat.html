<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chat App Pro - Broadcast Video Calls & Storage</title>
  <style>
    :root {
      --bg-color: #e5e5f7;
      --card-bg: #ffffff;
      --text-color: #333333;
      --header-bg: #007bff;
      --msg-sent: #007bff;
      --msg-sent-text: #ffffff;
      --msg-received: #e9ecef;
      --msg-received-text: #000000;
      --border-color: #dddddd;
    }

    body.dark-mode {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #f1f1f1;
      --header-bg: #1f2937;
      --msg-sent: #2563eb;
      --msg-sent-text: #ffffff;
      --msg-received: #374151;
      --msg-received-text: #f9fafb;
      --border-color: #374151;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; position: fixed; transition: background-color 0.3s; }

    #splash-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--card-bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.5s ease; }
    #splash-screen.fade-out { opacity: 0; pointer-events: none; }
    #splash-screen h1 { color: #007bff; font-size: 24px; font-weight: bold; }

    .modal-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; padding: 15px; }
    .modal-box { background: var(--card-bg); color: var(--text-color); padding: 20px; border-radius: 12px; width: 100%; max-width: 380px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center; }
    .modal-box h2 { margin-bottom: 15px; font-size: 20px; }
    .auth-form { display: flex; flex-direction: column; gap: 12px; }
    .auth-form input { padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; width: 100%; background: var(--card-bg); color: var(--text-color); }
    .btn { padding: 10px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; border: none; width: 100%; }
    .btn-primary { background: #007bff; color: white; }
    .btn-secondary { background: var(--msg-received); color: var(--text-color); margin-top: 8px; border: 1px solid var(--border-color); }
    .google-btn { background: #4285F4; color: white; margin-top: 10px; }
    .toggle-text { margin-top: 12px; font-size: 13px; opacity: 0.8; }
    .toggle-text span { color: #007bff; cursor: pointer; font-weight: bold; }

    /* Custom Confirm Modal Style */
    #custom-confirm-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 4000; justify-content: center; align-items: center; padding: 20px; }
    .confirm-box { background: var(--card-bg); color: var(--text-color); padding: 22px; border-radius: 14px; width: 100%; max-width: 320px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); animation: popUp 0.2s ease-in-out; }
    @keyframes popUp { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .confirm-box h3 { margin-bottom: 10px; font-size: 18px; color: #dc3545; }
    .confirm-box p { font-size: 14px; opacity: 0.85; margin-bottom: 20px; line-height: 1.4; }
    .confirm-actions { display: flex; gap: 10px; }

    .chat-container { width: 100vw; height: 100vh; height: 100dvh; background: var(--card-bg); display: flex; flex-direction: column; position: relative; overflow: hidden; }
    @media (min-width: 768px) { .chat-container { max-width: 650px; height: 90vh; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); } }

    .chat-header { background: var(--header-bg); color: white; padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; z-index: 10; flex-shrink: 0; }
    .header-top-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; }
    .search-container { position: relative; flex: 1; max-width: 180px; }
    #user-search { width: 100%; padding: 5px 10px; border-radius: 20px; border: none; outline: none; font-size: 13px; }
    .search-results { position: absolute; top: 32px; left: 0; background: var(--card-bg); width: 100%; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); max-height: 150px; overflow-y: auto; display: none; flex-direction: column; color: var(--text-color); z-index: 100; }
    .search-item { display: flex; align-items: center; gap: 8px; padding: 8px; border-bottom: 1px solid var(--border-color); cursor: pointer; }
    .search-item img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; }
    
    .chat-info { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: bold; }
    
    .friends-bar { display: flex; align-items: center; gap: 6px; overflow-x: auto; padding-bottom: 2px; width: 100%; scrollbar-width: none; }
    .friends-bar::-webkit-scrollbar { display: none; }
    .friend-chip { display: flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.2); padding: 3px 8px; border-radius: 20px; cursor: pointer; font-size: 12px; white-space: nowrap; border: 1px solid transparent; }
    .friend-chip.active { background: white; color: #007bff; font-weight: bold; }
    .friend-chip img { width: 18px; height: 18px; border-radius: 50%; object-fit: cover; }

    .user-profile img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; border: 1px solid white; cursor: pointer; }
    .header-btn { background: transparent; border: none; cursor: pointer; font-size: 18px; color: white; padding: 0 4px; }
    #logout-btn { background: transparent; color: white; border: 1px solid white; padding: 2px 6px; border-radius: 4px; cursor: pointer; font-size: 11px; }

    .chat-messages { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: var(--card-bg); }
    .message-wrapper { display: flex; gap: 8px; max-width: 88%; }
    .message-wrapper img.avatar { width: 26px; height: 26px; border-radius: 50%; align-self: flex-end; object-fit: cover; }
    .message-content { display: flex; flex-direction: column; }
    .sender-name { font-size: 10px; opacity: 0.7; margin-bottom: 2px; }
    .message { padding: 8px 12px; border-radius: 12px; word-wrap: break-word; font-size: 14px; position: relative; }
    .message img.chat-image { max-width: 100%; border-radius: 8px; margin-top: 4px; display: block; }
    .message audio { max-width: 200px; height: 35px; outline: none; margin-top: 4px; border-radius: 8px; }
    
    .msg-timestamp { font-size: 9px; opacity: 0.6; margin-top: 4px; text-align: right; }
    .reactions-bar { display: flex; gap: 4px; margin-top: 3px; font-size: 12px; }
    .reaction-badge { background: rgba(0,0,0,0.05); padding: 1px 5px; border-radius: 10px; cursor: pointer; }

    .action-icon { background: none; border: none; font-size: 14px; cursor: pointer; opacity: 0.5; padding: 4px; }
    .action-icon:hover { opacity: 1; }

    .message-wrapper.sent { align-self: flex-end; flex-direction: row-reverse; }
    .message-wrapper.sent .message { background: var(--msg-sent); color: var(--msg-sent-text); border-bottom-right-radius: 2px; }
    .message-wrapper.sent .sender-name { display: none; }
    .message-wrapper.received { align-self: flex-start; }
    .message-wrapper.received .message { background: var(--msg-received); color: var(--msg-received-text); border-bottom-left-radius: 2px; }
    .message-row { display: flex; align-items: center; gap: 4px; }
    .message-wrapper.sent .message-row { flex-direction: row-reverse; }

    .chat-input-area { display: flex; padding: 8px 6px; background: var(--card-bg); border-top: 1px solid var(--border-color); align-items: center; gap: 4px; flex-shrink: 0; position: relative; width: 100%; }
    .chat-input-area input[type="text"] { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--border-color); border-radius: 20px; outline: none; font-size: 14px; background: var(--card-bg); color: var(--text-color); }
    .icon-btn { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text-color); padding: 2px; opacity: 0.8; flex-shrink: 0; }
    #mic-btn.recording { color: red; opacity: 1; }
    .send-btn { background: #007bff; color: white; border: none; padding: 8px 12px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 13px; flex-shrink: 0; }

    #emoji-picker { display: none; position: absolute; bottom: 55px; left: 10px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); width: 240px; grid-template-columns: repeat(6, 1fr); gap: 10px; z-index: 1000; }
    .emoji-item { cursor: pointer; font-size: 22px; text-align: center; user-select: none; transition: transform 0.1s; }
    .emoji-item:hover { transform: scale(1.2); }

    #video-call-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000; display: none; }
    .video-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
    
    .call-controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; justify-content: center; padding: 12px; background: rgba(0,0,0,0.75); border-radius: 12px; align-items: center; z-index: 2010; width: max-content; max-width: 95%; flex-wrap: wrap; }
    .call-btn { background: rgba(255,255,255,0.2); border: 1px solid white; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }
    .call-btn.active-off { background: red; border-color: red; }

    #media-edit-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 3000; justify-content: center; align-items: center; flex-direction: column; padding: 20px; }
    .edit-box { background: var(--card-bg); color: var(--text-color); padding: 20px; border-radius: 12px; text-align: center; max-width: 400px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    #edit-preview { max-width: 100%; max-height: 220px; border-radius: 8px; margin-bottom: 12px; object-fit: contain; }
  </style>
  <script>
    if (localStorage.getItem('app_theme') === 'dark') {
      document.documentElement.classList.add('dark-mode');
      document.body.classList.add('dark-mode');
    }
  </script>
</head>
<body>

  <div id="splash-screen"><h1>Starting Chat App...</h1></div>

  <div id="custom-confirm-modal">
    <div class="confirm-box">
      <h3 id="confirm-title">⚠️ Confirmation</h3>
      <p id="confirm-message">Are you sure?</p>
      <div class="confirm-actions">
        <button id="confirm-cancel-btn" class="btn btn-secondary" style="margin-top: 0;">Cancel</button>
        <button id="confirm-ok-btn" class="btn btn-primary" style="color: white;">Confirm</button>
      </div>
    </div>
  </div>

  <div id="auth-screen" class="modal-screen" style="display: none;">
    <div class="modal-box">
      <h2 id="auth-title">Login</h2>
      <form id="login-form" class="auth-form">
        <input type="email" id="login-email" placeholder="Email" required>
        <input type="password" id="login-password" placeholder="Password" required>
        <button type="submit" class="btn btn-primary">Log In</button>
      </form>
      <form id="register-form" class="auth-form" style="display: none;">
        <input type="text" id="reg-name" placeholder="Your Name" required>
        <input type="email" id="reg-email" placeholder="Email" required>
        <input type="password" id="reg-password" placeholder="Password (min 6 chars)" required minlength="6">
        <button type="submit" class="btn btn-primary">Register</button>
      </form>
      <button id="google-btn" class="btn google-btn">Sign in with Google</button>
      <div class="toggle-text" id="toggle-to-register">Don't have an account? <span>Register here</span></div>
      <div class="toggle-text" id="toggle-to-login" style="display: none;">Already have an account? <span>Log in</span></div>
    </div>
  </div>

  <div id="profile-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 3500; justify-content: center; align-items: center;">
    <div style="background: var(--card-bg); color: var(--text-color); padding: 24px; border-radius: 12px; width: 100%; max-width: 320px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2);">
      <img id="modal-profile-pic" src="" alt="Profile" style="width: 70px; height: 70px; border-radius: 50%; object-fit: cover; margin-bottom: 12px; border: 2px solid #007bff;">
      <h3 id="modal-profile-name" style="margin-bottom: 6px; font-size: 18px;">Account Name</h3>
      <p id="modal-profile-email" style="font-size: 13px; opacity: 0.7; margin-bottom: 15px;"></p>
      
      <div style="margin-bottom: 20px; font-size: 14px; text-align: left; background: var(--msg-received); padding: 10px; border-radius: 8px;">
        <div style="display: flex; justify-content: space-between; margin-bottom: 5px;">
          <strong>Cloud Storage:</strong> <span id="storage-text">0 KB / 1024 KB</span>
        </div>
        <div style="width: 100%; background: var(--border-color); height: 10px; border-radius: 5px; overflow: hidden;">
          <div id="storage-bar" style="width: 0%; height: 100%; background: #007bff; border-radius: 5px; transition: width 0.3s, background 0.3s;"></div>
        </div>
        <p id="storage-warning-text" style="font-size: 11px; margin-top: 5px; opacity: 0.8; text-align: center;">Maximum allowance: 1 MB per user</p>
        
        <button id="profile-delete-all-btn" class="btn" style="background: #dc3545; color: white; margin-top: 10px; font-size: 13px; padding: 6px; display: none;">🗑️ Clear All Messages (Memory Full)</button>
      </div>

      <button id="modal-theme-toggle" class="btn btn-secondary" style="margin-bottom: 10px;">Toggle Dark Mode</button>
      <button id="modal-delete-account" class="btn" style="background: #dc3545; color: white; margin-bottom: 10px;">Request Account Deletion</button>
      <button id="close-profile-modal" class="btn btn-primary">Close Profile</button>
    </div>
  </div>

  <div id="media-edit-modal">
    <div class="edit-box">
      <h2>Edit Picture</h2>
      <img id="edit-preview" src="" alt="Preview">
      <p id="edit-status" style="font-size: 13px; opacity: 0.8; margin-bottom: 10px;"></p>
      
      <div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 12px;">
        <label style="font-size: 13px;">Background Color:</label>
        <input type="color" id="bg-replace-color" value="#ffffff" style="width: 35px; height: 30px; border: none; border-radius: 4px; cursor: pointer;">
        <button id="apply-bg-color-btn" class="btn btn-secondary" style="padding: 6px 10px; font-size: 12px; margin-top: 0; width: auto;">Apply Color</button>
      </div>

      <div style="display: flex; gap: 8px; flex-direction: column;">
        <button id="remove-bg-btn" class="btn btn-primary">✨ Remove Background (AI)</button>
        <button id="download-edited-btn" class="btn btn-primary" style="background: #17a2b8;">💾 Download to Device</button>
        <button id="send-edited-btn" class="btn btn-primary" style="background: #28a745;">Send to Chat</button>
        <button id="cancel-edit-btn" class="btn btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <div class="chat-container">
    
    <div id="video-call-screen">
      <div style="position: absolute; top: 0; left: 0; width: 100%; z-index: 2010; display:flex; justify-content:space-between; color:white; font-weight:bold; padding:15px; align-items:center; background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);">
        <span id="call-status">Connecting...</span>
        <button id="end-call-btn" style="background:red; color:white; border:none; padding:8px 16px; border-radius:6px; cursor:pointer; font-weight:bold;">End Call</button>
      </div>
      
      <div class="video-layer">
        <video id="remote-video" autoplay playsinline style="width:100%; height:100%; object-fit:cover; background:#222;"></video>
        <video id="local-video" autoplay playsinline muted style="position:absolute; bottom:90px; right:20px; width:100px; height:150px; object-fit:cover; border-radius:8px; border:2px solid white; background:#111; z-index: 2005; box-shadow: 0 4px 10px rgba(0,0,0,0.5);"></video>
      </div>

      <div class="call-controls">
        <button id="mute-mic-btn" class="call-btn">🎤 Mute</button>
        <button id="toggle-cam-btn" class="call-btn">📷 Cam Off</button>
        <button id="flip-cam-btn" class="call-btn">🔄 Flip</button>
      </div>
    </div>

    <header class="chat-header">
      <div class="header-top-row">
        <div class="search-container">
          <input type="text" id="user-search" placeholder="🔍 Search friend...">
          <div id="search-results" class="search-results"></div>
        </div>
        <div class="chat-info">
          <span id="room-label">Global Chat</span>
        </div>
        <div style="display: flex; gap: 6px; align-items: center;">
          <div id="user-profile" class="user-profile" style="display: none;">
            <img id="user-pic" src="" alt="Profile" title="Open Profile & Settings">
          </div>
          <button id="remove-friend-btn" class="header-btn" title="Remove Friend" style="display: none; font-size: 14px;">❌</button>
          <button id="video-call-btn" class="header-btn" title="Start Video Call">🎥</button>
          <button id="logout-btn" style="display:none;">Logout</button>
        </div>
      </div>
      <div class="friends-bar" id="friends-bar">
        <div class="friend-chip active" id="chip-global" onclick="switchRoom('global', 'Global Chat', 'global')">🌐 Global</div>
        <div class="friend-chip" id="chip-bot" onclick="switchRoom('bot', 'AI Bot', 'bot')">🤖 AI Bot</div>
      </div>
    </header>

    <main class="chat-messages" id="chat-messages"></main>

    <form class="chat-input-area" id="chat-form">
      <label for="chat-image-upload" class="icon-btn" title="Send picture" style="cursor: pointer;">📎</label>
      <input type="file" id="chat-image-upload" accept="image/*" style="display: none;">
      
      <button type="button" id="mic-btn" class="icon-btn" title="Record Voice">🎤</button>
      <button type="button" id="emoji-btn" class="icon-btn" title="Emojis">😀</button>
      
      <div id="emoji-picker"></div>

      <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
      <button type="submit" class="send-btn">Send</button>
    </form>
  </div>

  <script type="module">

  appId: "1:77752028345:web:81c423c896b0701bfc9f68",

      "joke": "Why don't scientists trust atoms? Because they make up everything!",
      "who are you": "I am an AI!",
      "default": "That sounds interesting! Tell me more about it."
    };

    function showCustomConfirm(title, message, onConfirm, okText = "Delete All", okColor = "#dc3545") {
      const modal = document.getElementById('custom-confirm-modal');
      document.getElementById('confirm-title').innerText = title;
      document.getElementById('confirm-message').innerText = message;
      
      const okBtn = document.getElementById('confirm-ok-btn');
      okBtn.innerText = okText;
      okBtn.style.background = okColor;

      modal.style.display = 'flex';

      const cancelBtn = document.getElementById('confirm-cancel-btn');

      const newOkBtn = okBtn.cloneNode(true);
      okBtn.parentNode.replaceChild(newOkBtn, okBtn);

    async function checkAndUpdateStorage(fileSize) {
      if (!currentUser) return false;
      const userRef = doc(db, "users", currentUser.uid);
      const snap = await getDoc(userRef);
      let currentStorage = 0;
      if (snap.exists() && snap.data().storageUsed) {
          currentStorage = snap.data().storageUsed;
      }
      
      if (currentStorage + fileSize > MAX_STORAGE_BYTES) {
          // Trigger the failover system if storage limits are hit
          const switched = await switchToNextFirebase();
          return switched; 
      }
      
      await updateDoc(userRef, { storageUsed: currentStorage + fileSize });
      return true;
    }

            if (data.type === 'global') isForMe = true;

            if (data.caller !== currentUser.uid && !pc && isForMe) {
              ringtone.play().catch(() => {});
              if ("vibrate" in navigator) navigator.vibrate([500, 200, 500, 200, 500]);
              
              const callerName = data.callerName || "Someone";
              const callTypeStr = data.type === 'global' ? 'a Global Call' : 'a Private Call';
              
              showCustomConfirm("📞 Incoming Call", `Incoming ${callTypeStr} from ${callerName}. Do you want to answer?`, async () => {
                ringtone.pause(); ringtone.currentTime = 0;
                const callDocRef = change.doc.ref;
                try {
                  const freshSnap = await getDoc(callDocRef);
                  if (!freshSnap.exists() || freshSnap.data().answer) { alert("Call already answered or ended!"); return; }

                  document.getElementById('video-call-screen').style.display = 'flex';
                  document.getElementById('call-status').innerText = `Connected with ${callerName}`;
                  currentFacingMode = "user";

                  localStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode }, audio: true });
                  document.getElementById('local-video').srcObject = localStream;

                  pc = new RTCPeerConnection(servers);
                  remoteStream = new MediaStream();
                  document.getElementById('remote-video').srcObject = remoteStream;

                  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
                  pc.ontrack = event => { event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track)); };

                  const offerCandidates = collection(callDocRef, "offerCandidates");
                  const answerCandidates = collection(callDocRef, "answerCandidates");

                  pc.onicecandidate = event => { if (event.candidate) addDoc(answerCandidates, event.candidate.toJSON()); };

                  await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
                  const answer = await pc.createAnswer();
                  await pc.setLocalDescription(answer);
                  await setDoc(callDocRef, { answer: { type: answer.type, sdp: answer.sdp }, answeredBy: currentUser.uid }, { merge: true });

                  onSnapshot(offerCandidates, (snapshot) => {
                    snapshot.docChanges().forEach(async (change) => {
                      if (change.type === 'added') pc.addIceCandidate(new RTCIceCandidate(change.doc.data()));
                    });
                  });

                  window.activeCallDoc = callDocRef;
                  listenToCallTermination(callDocRef);

                  alert("Could not connect call: " + err.message);
                  document.getElementById('video-call-screen').style.display = 'none';

function forceCloseCallUI() {
  ringtone.pause(); ringtone.currentTime = 0;

  if (pc) { pc.close(); pc = null; }

  if (window.activeCallDoc) {
    deleteDoc(window.activeCallDoc).catch(() => {});

  if (activeCallDocUnsubscribe) { activeCallDocUnsubscribe(); activeCallDocUnsubscribe = null; }
  window.activeCallDoc = null;
}

    };

    function formatTime(timestamp) {
      if (!timestamp) return new Date().toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      const date = timestamp.seconds ? new Date(timestamp.seconds * 1000) : new Date(timestamp);
      return date.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function appendMessageToUI(data, docId, isLocal = false) {
      const chatMessages = document.getElementById('chat-messages');
      const isMe = data.uid === currentUser.uid;

      const wrapper = document.createElement('div');
      wrapper.className = `message-wrapper ${isMe ? 'sent' : 'received'}`;

      const name = data.name || 'User';
      const avatar = data.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=random`;
      
      let textContent = data.text ? `<div>${data.text}</div>` : '';
      let imageContent = data.imageUrl ? `<img src="${data.imageUrl}" class="chat-image">` : '';
      let audioContent = data.audioUrl ? `<audio controls src="${data.audioUrl}"></audio>` : '';
      let timeFormatted = formatTime(data.createdAt);
      let reaction = data.reaction ? `<div class="reactions-bar"><span class="reaction-badge">${data.reaction}</span></div>` : '';

      wrapper.innerHTML = `
        <img src="${avatar}" class="avatar">
        <div class="message-content">
          <span class="sender-name">${name}</span>
          <div class="message-row">
            <div class="message">
              ${textContent}${imageContent}${audioContent}
              <div class="msg-timestamp">${timeFormatted}</div>
              ${reaction}
            </div>
          </div>
        </div>`;

      const msgRow = wrapper.querySelector('.message-row');
      const msgBubble = wrapper.querySelector('.message');

      const copyBtn = document.createElement('button');
      copyBtn.className = 'action-icon';
      copyBtn.innerHTML = '📋';
      copyBtn.title = 'Copy message';
      copyBtn.onclick = (e) => {
        e.stopPropagation();
        const textToCopy = data.text || (data.imageUrl ? data.imageUrl : "Audio message");
        navigator.clipboard.writeText(textToCopy).then(() => {
          copyBtn.innerHTML = '✅';
          setTimeout(() => { copyBtn.innerHTML = '📋'; }, 1500);
        }).catch(err => { alert('Failed to copy text.'); });
      };
      msgRow.appendChild(copyBtn);

      msgBubble.onclick = async () => {
        const chosenEmoji = prompt("React to message (e.g. ❤️, 👍, 😂, 🔥):");
        if (chosenEmoji && docId && !isLocal) {
          try { await updateDoc(doc(db, "messages", docId), { reaction: chosenEmoji }); } catch(e) {}
        }
      };

      if ((isMe || data.uid === "ai_bot_123") && docId) {
        const delBtn = document.createElement('button');
        delBtn.className = 'action-icon'; delBtn.innerHTML = '🗑️';
        delBtn.title = 'Delete message';
        delBtn.onclick = async (e) => {
          e.stopPropagation();
          showCustomConfirm("🗑️ Delete Message", "Are you sure you want to delete this message?", async () => {
             if (isLocal) {
                 let localMsgs = JSON.parse(localStorage.getItem('bot_messages') || '[]');
                 localMsgs = localMsgs.filter(m => m.id !== docId);
                 localStorage.setItem('bot_messages', JSON.stringify(localMsgs));
                 loadLocalBotMessages(); 
             } else {
                 await deleteDoc(doc(db, "messages", docId));
             }
          }, "Delete", "#dc3545");
        };
        msgRow.appendChild(delBtn);
      }

      chatMessages.appendChild(wrapper);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function loadLocalBotMessages() {
        const chatMessages = document.getElementById('chat-messages');
        chatMessages.innerHTML = '';
        const localMsgs = JSON.parse(localStorage.getItem('bot_messages') || '[]');
        localMsgs.forEach(msg => appendMessageToUI(msg, msg.id, true));
    }

    function loadMessages() {
      if (unsubscribeMessages) unsubscribeMessages();
      const q = query(collection(db, "messages"), orderBy("createdAt", "asc"));
      let firstLoad = true;

      unsubscribeMessages = onSnapshot(q, (snapshot) => {
        document.getElementById('chat-messages').innerHTML = '';
        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          if ((data.room || 'global') === currentRoom) appendMessageToUI(data, docSnap.id, false);
        });

        if (!firstLoad && snapshot.docChanges().some(change => change.type === 'added')) {
          soundEffect.play().catch(() => {});
          if ("vibrate" in navigator) navigator.vibrate([200, 100, 200]);
        }
        firstLoad = false;
      });
      listenForIncomingCalls();
    }

    document.getElementById('chat-form').onsubmit = async (e) => {
      e.preventDefault();
      let text = messageInput.value.trim();
      emojiPicker.style.display = 'none';
      if (!text) return;

      badWords.forEach(word => { const reg = new RegExp(word, 'gi'); text = text.replace(reg, '***'); });

      if (currentRoom === 'bot') {
          const userMsg = { id: Date.now().toString(), text: text, imageUrl: null, audioUrl: null, uid: currentUser.uid, name: currentUser.displayName || "User", photoURL: currentUser.photoURL || "", room: "bot", createdAt: Date.now() };
          let localMsgs = JSON.parse(localStorage.getItem('bot_messages') || '[]');
          localMsgs.push(userMsg); localStorage.setItem('bot_messages', JSON.stringify(localMsgs)); loadLocalBotMessages();
          
          const normalizedInput = text.toLowerCase().trim();
          const botReply = brain[normalizedInput] || brain["default"];

          setTimeout(() => {
              const botMsg = { id: (Date.now() + 1).toString(), text: botReply, imageUrl: null, audioUrl: null, uid: "ai_bot_123", name: "AI Bot", photoURL: "https://ui-avatars.com/api/?name=Bot&background=0D8ABC&color=fff", room: "bot", createdAt: Date.now() + 1000 };
              let msgs = JSON.parse(localStorage.getItem('bot_messages') || '[]');
              msgs.push(botMsg); localStorage.setItem('bot_messages', JSON.stringify(msgs)); loadLocalBotMessages();
          }, 1000);
      } else {
          await addDoc(collection(db, "messages"), { text: text, imageUrl: null, audioUrl: null, uid: currentUser.uid, name: currentUser.displayName || "User", photoURL: currentUser.photoURL || "", room: currentRoom, createdAt: serverTimestamp() });
      }
      messageInput.value = '';
    };

    let mediaRecorder; let audioChunks = []; let isRecording = false; const micBtn = document.getElementById('mic-btn');
    micBtn.onclick = async () => {
        if (!isRecording) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                let mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
                mediaRecorder = new MediaRecorder(stream, { mimeType });
                audioChunks = [];

                mediaRecorder.start();
                isRecording = true; micBtn.innerText = "🛑"; micBtn.classList.add("recording");
                messageInput.placeholder = "Recording..."; messageInput.disabled = true;

                mediaRecorder.addEventListener("dataavailable", e => { if (e.data.size > 0) audioChunks.push(e.data); });
                mediaRecorder.addEventListener("stop", async () => {
                    const audioBlob = new Blob(audioChunks, { type: mimeType });
                    const fileSize = audioBlob.size;
                    
                    const hasSpace = await checkAndUpdateStorage(fileSize);
                    if (!hasSpace) {
                        messageInput.placeholder = "Type a message..."; messageInput.disabled = false; stream.getTracks().forEach(t => t.stop());
                        return;
                    }

                    messageInput.placeholder = "Uploading audio...";
                    const audioRef = ref(storage, 'chat_audio/' + currentUser.uid + '_' + Date.now() + (mimeType.includes('mp4') ? '.mp4' : '.webm'));
                    try {
                        await uploadBytes(audioRef, audioBlob); 
                        const audioUrl = await getDownloadURL(audioRef);
                        await addDoc(collection(db, "messages"), { text: "", imageUrl: null, audioUrl: audioUrl, fileSizeBytes: fileSize, uid: currentUser.uid, name: currentUser.displayName || "User", photoURL: currentUser.photoURL || "", room: currentRoom, createdAt: serverTimestamp() });
                    } catch (e) { alert("Audio error: " + e.message); } 
                    finally { messageInput.placeholder = "Type a message..."; messageInput.disabled = false; stream.getTracks().forEach(t => t.stop()); }
                });
            } catch(e) { alert("Microphone access needed."); }
        } else {
            if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
            isRecording = false; micBtn.innerText = "🎤"; micBtn.classList.remove("recording");
        }
    };
  </script>
</body>
</html>
