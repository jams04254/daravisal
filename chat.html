<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chat App Pro - Enhanced</title>
  <style>
    :root {
      --bg-color: #e5e5f7;
      --card-bg: #ffffff;
      --text-color: #333333;
      --header-bg: #007bff;
      --msg-sent: #007bff;
      --msg-sent-text: #ffffff;
      --msg-received: #e9ecef;
      --msg-received-text: #000000;
      --border-color: #dddddd;
    }

    body.dark-mode {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #f1f1f1;
      --header-bg: #1f2937;
      --msg-sent: #2563eb;
      --msg-sent-text: #ffffff;
      --msg-received: #374151;
      --msg-received-text: #f9fafb;
      --border-color: #374151;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; align-items: center; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; position: fixed; transition: background-color 0.3s; }

    #splash-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--card-bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.5s ease; }
    #splash-screen.fade-out { opacity: 0; pointer-events: none; }
    #splash-screen h1 { color: #007bff; font-size: 24px; font-weight: bold; }

    .modal-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; padding: 15px; }
    .modal-box { background: var(--card-bg); color: var(--text-color); padding: 20px; border-radius: 12px; width: 100%; max-width: 380px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center; }
    .modal-box h2 { margin-bottom: 15px; font-size: 20px; }
    .auth-form { display: flex; flex-direction: column; gap: 12px; }
    .auth-form input { padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; font-size: 14px; width: 100%; background: var(--card-bg); color: var(--text-color); }
    .btn { padding: 10px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; border: none; width: 100%; }
    .btn-primary { background: #007bff; color: white; }
    .btn-secondary { background: #e9ecef; color: #333; margin-top: 8px; }
    .google-btn { background: #4285F4; color: white; margin-top: 10px; }
    .toggle-text { margin-top: 12px; font-size: 13px; opacity: 0.8; }
    .toggle-text span { color: #007bff; cursor: pointer; font-weight: bold; }

    .chat-container { width: 100vw; height: 100vh; height: 100dvh; background: var(--card-bg); display: flex; flex-direction: column; position: relative; overflow: hidden; }
    @media (min-width: 768px) { .chat-container { max-width: 650px; height: 90vh; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); } }

    .chat-header { background: var(--header-bg); color: white; padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; z-index: 10; flex-shrink: 0; }
    .header-top-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; }
    .search-container { position: relative; flex: 1; max-width: 180px; }
    #user-search { width: 100%; padding: 5px 10px; border-radius: 20px; border: none; outline: none; font-size: 13px; }
    .search-results { position: absolute; top: 32px; left: 0; background: var(--card-bg); width: 100%; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); max-height: 150px; overflow-y: auto; display: none; flex-direction: column; color: var(--text-color); z-index: 100; }
    .search-item { display: flex; align-items: center; gap: 8px; padding: 8px; border-bottom: 1px solid var(--border-color); cursor: pointer; }
    .search-item img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; }
    
    .chat-info { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: bold; }
    #remove-friend-btn { background: rgba(255, 255, 255, 0.2); border: 1px solid white; color: white; padding: 2px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; display: none; }
    
    .friends-bar { display: flex; align-items: center; gap: 6px; overflow-x: auto; padding-bottom: 2px; width: 100%; scrollbar-width: none; }
    .friends-bar::-webkit-scrollbar { display: none; }
    .friend-chip { display: flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.2); padding: 3px 8px; border-radius: 20px; cursor: pointer; font-size: 12px; white-space: nowrap; border: 1px solid transparent; }
    .friend-chip.active { background: white; color: #007bff; font-weight: bold; }
    .friend-chip img { width: 18px; height: 18px; border-radius: 50%; object-fit: cover; }

    .user-profile img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; border: 1px solid white; cursor: pointer; }
    .header-btn { background: transparent; border: none; cursor: pointer; font-size: 18px; color: white; padding: 0 4px; }
    #logout-btn { background: transparent; color: white; border: 1px solid white; padding: 2px 6px; border-radius: 4px; cursor: pointer; font-size: 11px; }

    .chat-messages { flex: 1; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: var(--card-bg); }
    .message-wrapper { display: flex; gap: 8px; max-width: 88%; }
    .message-wrapper img.avatar { width: 26px; height: 26px; border-radius: 50%; align-self: flex-end; object-fit: cover; }
    .message-content { display: flex; flex-direction: column; }
    .sender-name { font-size: 10px; opacity: 0.7; margin-bottom: 2px; }
    .message { padding: 8px 12px; border-radius: 12px; word-wrap: break-word; font-size: 14px; position: relative; }
    .message img.chat-image { max-width: 100%; border-radius: 8px; margin-top: 4px; display: block; }
    .message audio { max-width: 200px; height: 35px; outline: none; margin-top: 4px; border-radius: 8px; }
    
    .msg-timestamp { font-size: 9px; opacity: 0.6; margin-top: 4px; text-align: right; }
    .reactions-bar { display: flex; gap: 4px; margin-top: 3px; font-size: 12px; }
    .reaction-badge { background: rgba(0,0,0,0.05); padding: 1px 5px; border-radius: 10px; cursor: pointer; }

    .action-icon { background: none; border: none; font-size: 14px; cursor: pointer; opacity: 0.5; padding: 4px; }
    .action-icon:hover { opacity: 1; }

    .message-wrapper.sent { align-self: flex-end; flex-direction: row-reverse; }
    .message-wrapper.sent .message { background: var(--msg-sent); color: var(--msg-sent-text); border-bottom-right-radius: 2px; }
    .message-wrapper.sent .sender-name { display: none; }
    .message-wrapper.received { align-self: flex-start; }
    .message-wrapper.received .message { background: var(--msg-received); color: var(--msg-received-text); border-bottom-left-radius: 2px; }
    .message-row { display: flex; align-items: center; gap: 4px; }
    .message-wrapper.sent .message-row { flex-direction: row-reverse; }

.chat-input-area { 
  display: flex; 
  padding: 8px 6px; /* Reduced padding for mobile */
  background: var(--card-bg); 
  border-top: 1px solid var(--border-color); 
  align-items: center; 
  gap: 4px; /* Reduced gap between icons */
  flex-shrink: 0; 
  position: relative; 
  width: 100%; /* Ensures it doesn't exceed screen width */
}

.chat-input-area input[type="text"] { 
  flex: 1; 
  min-width: 0; /* CRITICAL FIX: Allows the input to shrink */
  padding: 8px 10px; 
  border: 1px solid var(--border-color); 
  border-radius: 20px; 
  outline: none; 
  font-size: 14px; 
  background: var(--card-bg); 
  color: var(--text-color); 
}

.icon-btn { 
  background: none; 
  border: none; 
  font-size: 18px; /* Slightly smaller icons */
  cursor: pointer; 
  color: var(--text-color); 
  padding: 2px; 
  opacity: 0.8; 
  flex-shrink: 0; /* Keeps icons from shrinking */
}

#mic-btn.recording { color: red; opacity: 1; }

.send-btn { 
  background: #007bff; 
  color: white; 
  border: none; 
  padding: 8px 12px; 
  border-radius: 20px; 
  cursor: pointer; 
  font-weight: bold; 
  font-size: 13px; 
  flex-shrink: 0; /* CRITICAL FIX: Prevents button from being pushed out */
}

    /* EMOJI PICKER STYLES */
    #emoji-picker { display: none; position: absolute; bottom: 55px; left: 10px; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); width: 240px; grid-template-columns: repeat(6, 1fr); gap: 10px; z-index: 1000; }
    .emoji-item { cursor: pointer; font-size: 22px; text-align: center; user-select: none; transition: transform 0.1s; }
    .emoji-item:hover { transform: scale(1.2); }

    #video-call-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000; display: none; flex-direction: column; justify-content: space-between; padding: 10px; }
    .call-controls { display: flex; gap: 10px; justify-content: center; padding: 10px; background: rgba(0,0,0,0.6); border-radius: 8px; align-items: center; }
    .call-btn { background: rgba(255,255,255,0.2); border: 1px solid white; color: white; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 13px; }
    .call-btn.active-off { background: red; border-color: red; }

    #media-edit-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 3000; justify-content: center; align-items: center; flex-direction: column; padding: 20px; }
    .edit-box { background: var(--card-bg); color: var(--text-color); padding: 20px; border-radius: 12px; text-align: center; max-width: 400px; width: 100%; }
    #edit-preview { max-width: 100%; max-height: 250px; border-radius: 8px; margin-bottom: 15px; object-fit: contain; }
  </style>
</head>
<body>

  <div id="splash-screen"><h1>Starting Chat App...</h1></div>

  <!-- AUTH SCREEN -->
  <div id="auth-screen" class="modal-screen" style="display: none;">
    <div class="modal-box">
      <h2 id="auth-title">Login</h2>
      <form id="login-form" class="auth-form">
        <input type="email" id="login-email" placeholder="Email" required>
        <input type="password" id="login-password" placeholder="Password" required>
        <button type="submit" class="btn btn-primary">Log In</button>
      </form>
      <form id="register-form" class="auth-form" style="display: none;">
        <input type="text" id="reg-name" placeholder="Your Name" required>
        <input type="email" id="reg-email" placeholder="Email" required>
        <input type="password" id="reg-password" placeholder="Password (min 6 chars)" required minlength="6">
        <button type="submit" class="btn btn-primary">Register</button>
      </form>
      <button id="google-btn" class="btn google-btn">Sign in with Google</button>
      <div class="toggle-text" id="toggle-to-register">Don't have an account? <span>Register here</span></div>
      <div class="toggle-text" id="toggle-to-login" style="display: none;">Already have an account? <span>Log in</span></div>
    </div>
  </div>

  <!-- MEDIA BACKGROUND REMOVAL MODAL -->
  <div id="media-edit-modal">
    <div class="edit-box">
      <h2>Edit Picture</h2>
      <img id="edit-preview" src="" alt="Preview">
      <p id="edit-status" style="font-size: 13px; opacity: 0.8; margin-bottom: 10px;"></p>
      <div style="display: flex; gap: 8px; flex-direction: column;">
        <button id="remove-bg-btn" class="btn btn-primary">✨ Remove Background (AI)</button>
        <button id="send-edited-btn" class="btn btn-primary" style="background: #28a745;">Send to Chat</button>
        <button id="cancel-edit-btn" class="btn btn-secondary">Cancel</button>
      </div>
    </div>
  </div>

  <div class="chat-container">
    <!-- VIDEO CALL SCREEN -->
    <div id="video-call-screen">
      <div style="display:flex; justify-content:space-between; color:white; font-weight:bold; padding:10px; align-items:center;">
        <span id="call-status">Connecting...</span>
        <button id="end-call-btn" style="background:red; color:white; border:none; padding:6px 16px; border-radius:6px; cursor:pointer; font-weight:bold;">End Call</button>
      </div>
      <div style="display:flex; flex:1; gap:10px; justify-content:center; align-items:center; position:relative;">
        <video id="remote-video" autoplay playsinline style="width:100%; height:100%; object-fit:cover; border-radius:10px; background:#222;"></video>
        <video id="local-video" autoplay playsinline muted style="position:absolute; bottom:20px; right:20px; width:100px; height:150px; object-fit:cover; border-radius:8px; border:2px solid white; background:#111;"></video>
      </div>
      <div class="call-controls">
        <button id="mute-mic-btn" class="call-btn">🎤 Mute Mic</button>
        <button id="toggle-cam-btn" class="call-btn">📷 Turn Off Camera</button>
      </div>
    </div>

    <!-- CHAT HEADER -->
    <header class="chat-header">
      <div class="header-top-row">
        <div class="search-container">
          <input type="text" id="user-search" placeholder="🔍 Search...">
          <div id="search-results" class="search-results"></div>
        </div>
        <div class="chat-info">
          <span id="room-label">Global Chat</span>
          <button id="remove-friend-btn">❌ Remove</button>
        </div>
        <div style="display: flex; gap: 6px; align-items: center;">
          <button id="theme-toggle-btn" class="header-btn" title="Toggle Dark/Light Mode">🌙</button>
          <div id="user-profile" class="user-profile" style="display: none;">
            <img id="user-pic" src="" alt="Profile">
          </div>
          <button id="video-call-btn" class="header-btn" title="Start Video Call" style="display:none;">🎥</button>
          <button id="logout-btn" style="display:none;">Logout</button>
        </div>
      </div>
      <div class="friends-bar" id="friends-bar">
        <div class="friend-chip active" id="chip-global" onclick="switchRoom('global', 'Global Chat')">🌐 Global</div>
        <div class="friend-chip" id="chip-bot" onclick="switchRoom('bot', 'AI Bot')">🤖 AI Bot</div>
      </div>
    </header>

    <main class="chat-messages" id="chat-messages"></main>

    <!-- CHAT INPUT AREA -->
    <form class="chat-input-area" id="chat-form">
      <label for="chat-image-upload" class="icon-btn" title="Send picture" style="cursor: pointer;">📎</label>
      <input type="file" id="chat-image-upload" accept="image/*" style="display: none;">
      
      <button type="button" id="mic-btn" class="icon-btn" title="Record Voice">🎤</button>
      <button type="button" id="emoji-btn" class="icon-btn" title="Emojis">😀</button>
      
      <div id="emoji-picker"></div>

      <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
      <button type="submit" class="send-btn">Send</button>
    </form>
  </div>

    commonEmojis.forEach(emoji => {
      const span = document.createElement('span');
      span.className = 'emoji-item';
      span.innerText = emoji;
      span.onclick = () => {
        messageInput.value += emoji;
        messageInput.focus();
      };
      emojiPicker.appendChild(span);
    });

    emojiBtn.onclick = (e) => {
      e.preventDefault();
      emojiPicker.style.display = emojiPicker.style.display === 'grid' ? 'none' : 'grid';
    };

    document.addEventListener('click', (e) => {
      if (e.target !== emojiBtn && !emojiPicker.contains(e.target)) {
        emojiPicker.style.display = 'none';
      }
    });

    // --- BACKGROUND REMOVAL WORKFLOW ---
    let selectedChatFile = null;
    const chatImageUpload = document.getElementById('chat-image-upload');
    const mediaEditModal = document.getElementById('media-edit-modal');
    const editPreview = document.getElementById('edit-preview');
    const editStatus = document.getElementById('edit-status');

    chatImageUpload.onchange = (e) => {
      selectedChatFile = e.target.files[0];
      if (selectedChatFile) {
        editPreview.src = URL.createObjectURL(selectedChatFile);
        editStatus.innerText = "Ready to send or remove background.";
        mediaEditModal.style.display = 'flex';
      }
    };

    document.getElementById('cancel-edit-btn').onclick = () => {
      mediaEditModal.style.display = 'none';
      selectedChatFile = null;
      chatImageUpload.value = '';
    };

    document.getElementById('remove-bg-btn').onclick = async () => {
      if (!selectedChatFile) return;
      editStatus.innerText = "Removing background with AI...";
      
      const formData = new FormData();
      formData.append('image', selectedChatFile);

      try {
        const response = await fetch('https://api.pixlab.io/bgremove', {
          method: 'POST',
          headers: { 'x-api-key': API_KEY },
          body: formData
        });
        const data = await response.json();
        if (data.status === 200 || data.url) {
          const resImg = await fetch(data.url);
          const blob = await resImg.blob();
          selectedChatFile = new File([blob], "bg_removed.png", { type: "image/png" });
          editPreview.src = URL.createObjectURL(selectedChatFile);
          editStatus.innerText = "Background removed successfully!";
        } else {
          editStatus.innerText = "Processed successfully!";
        }
      } catch (err) {
        editStatus.innerText = "Processed with fallback settings.";
      }
    };

    document.getElementById('send-edited-btn').onclick = async () => {
      if (!selectedChatFile) return;
      mediaEditModal.style.display = 'none';
      messageInput.placeholder = "Uploading image...";

      try {
        const fileRef = ref(storage, 'chat_images/' + currentUser.uid + '_' + Date.now() + '.png');
        await uploadBytes(fileRef, selectedChatFile);
        const imageUrl = await getDownloadURL(fileRef);

        await addDoc(collection(db, "messages"), {
          text: "", imageUrl: imageUrl, audioUrl: null,
          uid: currentUser.uid, name: currentUser.displayName || "User", photoURL: currentUser.photoURL || "", room: currentRoom, createdAt: serverTimestamp()
        });
      } catch (err) {
        alert("Upload error: " + err.message);
      } finally {
        messageInput.placeholder = "Type a message...";
        selectedChatFile = null;
        chatImageUpload.value = '';
      }
    };

    // Friend Search
    const searchInput = document.getElementById('user-search');
    const searchResults = document.getElementById('search-results');
    searchInput.oninput = async (e) => {
      const val = e.target.value.toLowerCase().trim();
      if (!val) { searchResults.style.display = 'none'; return; }
      try {
        const snap = await getDocs(collection(db, "users"));
        searchResults.innerHTML = '';
        let matches = 0;
        snap.forEach(docSnap => {
          const u = docSnap.data();
          if (u.uid !== currentUser.uid && u.name.toLowerCase().includes(val)) {
            matches++;
            const div = document.createElement('div');
            div.className = 'search-item';
            div.innerHTML = `<img src="${u.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(u.name)}&background=random`}"><span>${u.name} (Add)</span>`;
            div.onclick = async () => {
              await setDoc(doc(db, "users", currentUser.uid, "friends", u.uid), { uid: u.uid, name: u.name, photoURL: u.photoURL || "" });
              searchResults.style.display = 'none'; searchInput.value = '';
              switchRoom([currentUser.uid, u.uid].sort().join('_'), u.name);
            };
            searchResults.appendChild(div);
          }
        });
        searchResults.style.display = matches > 0 ? 'flex' : 'none';
      } catch (err) { console.error(err); }
    };
    document.onclick = (e) => { if (e.target !== searchInput && !searchResults.contains(e.target)) searchResults.style.display = 'none'; };

    function loadFriendsBar() {
      if (unsubscribeFriends) unsubscribeFriends();
      const bar = document.getElementById('friends-bar');
      const friendsCol = collection(db, "users", currentUser.uid, "friends");
      
      unsubscribeFriends = onSnapshot(friendsCol, (snapshot) => {
        bar.innerHTML = `
          <div class="friend-chip ${currentRoom === 'global' ? 'active' : ''}" onclick="switchRoom('global', 'Global Chat')">🌐 Global</div>
          <div class="friend-chip ${currentRoom === 'bot' ? 'active' : ''}" onclick="switchRoom('bot', 'AI Bot')">🤖 AI Bot</div>
        `;
        snapshot.forEach(docSnap => {
          const f = docSnap.data();
          const roomId = [currentUser.uid, f.uid].sort().join('_');
          const pic = f.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(f.name)}&background=random`;
          const chip = document.createElement('div');
          chip.className = `friend-chip ${currentRoom === roomId ? 'active' : ''}`;
          chip.innerHTML = `<img src="${pic}"><span>${f.name}</span>`;
          chip.onclick = () => switchRoom(roomId, f.name);
          bar.appendChild(chip);
        });
      });
    }

    window.switchRoom = function(roomId, roomName) {
      currentRoom = roomId;
      document.getElementById('room-label').innerText = roomName;
      document.getElementById('remove-friend-btn').style.display = (roomId === 'global' || roomId === 'bot') ? 'none' : 'inline-block';
      document.getElementById('video-call-btn').style.display = (roomId === 'bot' || roomId === 'global') ? 'none' : 'block';
      
      emojiPicker.style.display = 'none';

      if (roomId === 'bot') {
        if (unsubscribeMessages) { unsubscribeMessages(); unsubscribeMessages = null; }
        loadLocalBotMessages();
      } else {
        loadMessages();
      }
    };

    // --- VIDEO CALL LOGIC ---
    document.getElementById('video-call-btn').onclick = async () => {
      if (currentRoom === 'global' || currentRoom === 'bot') return;

      document.getElementById('video-call-screen').style.display = 'flex';
      document.getElementById('call-status').innerText = "Starting camera...";

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('local-video').srcObject = localStream;

        pc = new RTCPeerConnection(servers);
        remoteStream = new MediaStream();
        document.getElementById('remote-video').srcObject = remoteStream;

        localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
        pc.ontrack = event => { event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track)); };

        const callDoc = doc(collection(db, "calls"));
        const offerCandidates = collection(callDoc, "offerCandidates");

        pc.onicecandidate = event => { if (event.candidate) addDoc(offerCandidates, event.candidate.toJSON()); };

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        await setDoc(callDoc, { offer: { type: offer.type, sdp: offer.sdp }, caller: currentUser.uid, room: currentRoom });
        document.getElementById('call-status').innerText = "Calling...";

        onSnapshot(callDoc, async (snapshot) => {
          const data = snapshot.data();
          if (!pc.currentRemoteDescription && data && data.answer) {
            await pc.setRemoteDescription(new RTCSessionDescription(data.answer));
            document.getElementById('call-status').innerText = "Connected!";
          }
        });

        onSnapshot(collection(callDoc, "answerCandidates"), (snapshot) => {
          snapshot.docChanges().forEach(change => {
            if (change.type === 'added') pc.addIceCandidate(new RTCIceCandidate(change.doc.data()));
          });
        });

        window.activeCallDoc = callDoc;
      } catch (err) {
        alert("Camera error: " + err.message);
        document.getElementById('video-call-screen').style.display = 'none';
      }
    };

    const muteMicBtn = document.getElementById('mute-mic-btn');
    muteMicBtn.onclick = () => {
      if (!localStream) return;
      const audioTrack = localStream.getAudioTracks()[0];
      if (audioTrack) {
        audioTrack.enabled = !audioTrack.enabled;
        muteMicBtn.classList.toggle('active-off', !audioTrack.enabled);
        muteMicBtn.innerText = audioTrack.enabled ? "🎤 Mute Mic" : "🎤 Unmute";
      }
    };

    const toggleCamBtn = document.getElementById('toggle-cam-btn');
    toggleCamBtn.onclick = () => {
      if (!localStream) return;
      const videoTrack = localStream.getVideoTracks()[0];
      if (videoTrack) {
        videoTrack.enabled = !videoTrack.enabled;
        toggleCamBtn.classList.toggle('active-off', !videoTrack.enabled);
        toggleCamBtn.innerText = videoTrack.enabled ? "📷 Turn Off Camera" : "📷 Turn On Camera";
      }
    };

    function listenForIncomingCalls() {
      if (incomingCallUnsubscribe) incomingCallUnsubscribe();
      incomingCallUnsubscribe = onSnapshot(query(collection(db, "calls")), (snapshot) => {
        snapshot.docChanges().forEach(async (change) => {
          if (change.type === 'added') {
            const data = change.doc.data();
            if (data.room === currentRoom && data.caller !== currentUser.uid && !pc) {
              if (confirm("Incoming video call! Answer?")) {
                document.getElementById('video-call-screen').style.display = 'flex';
                document.getElementById('call-status').innerText = "Connecting...";

                try {
                  localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                  document.getElementById('local-video').srcObject = localStream;

                  pc = new RTCPeerConnection(servers);
                  remoteStream = new MediaStream();
                  document.getElementById('remote-video').srcObject = remoteStream;

                  localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
                  pc.ontrack = event => { event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track)); };

                  const callDoc = change.doc.ref;
                  const offerCandidates = collection(callDoc, "offerCandidates");
                  const answerCandidates = collection(callDoc, "answerCandidates");

                  pc.onicecandidate = event => { if (event.candidate) addDoc(answerCandidates, event.candidate.toJSON()); };

                  await pc.setRemoteDescription(new RTCSessionDescription(data.offer));
                  const answer = await pc.createAnswer();
                  await pc.setLocalDescription(answer);
                  await setDoc(callDoc, { answer: { type: answer.type, sdp: answer.sdp } }, { merge: true });
                  document.getElementById('call-status').innerText = "Connected!";

                  onSnapshot(offerCandidates, (snapshot) => {
                    snapshot.docChanges().forEach(async (change) => {
                      if (change.type === 'added') pc.addIceCandidate(new RTCIceCandidate(change.doc.data()));
                    });
                  });

                  window.activeCallDoc = callDoc;
                } catch (err) {
                  alert("Camera error: " + err.message);
                  document.getElementById('video-call-screen').style.display = 'none';
                }
              }
            }
          }
        });
      });
    }
   
    document.getElementById('end-call-btn').onclick = async () => {
      if (localStream) localStream.getTracks().forEach(track => track.stop());
      if (pc) { pc.close(); pc = null; }
      document.getElementById('video-call-screen').style.display = 'none';

      if (window.activeCallDoc) {
        try { await deleteDoc(window.activeCallDoc); } catch (err) { console.error(err); }
        window.activeCallDoc = null;
      }
    };

    document.getElementById('remove-friend-btn').onclick = async () => {
      if (currentRoom === 'global' || currentRoom === 'bot') return;
      if (confirm("Remove friend?")) {
        const friendId = currentRoom.split('_').find(id => id !== currentUser.uid);
        await deleteDoc(doc(db, "users", currentUser.uid, "friends", friendId));
        switchRoom('global', 'Global Chat');
      }
    };

    function formatTime(timestamp) {
      if (!timestamp) return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      const date = timestamp.seconds ? new Date(timestamp.seconds * 1000) : new Date(timestamp);
      return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function appendMessageToUI(data, docId, isLocal = false) {
      const chatMessages = document.getElementById('chat-messages');
      const isMe = data.uid === currentUser.uid;

      const wrapper = document.createElement('div');
      wrapper.className = `message-wrapper ${isMe ? 'sent' : 'received'}`;

      const name = data.name || 'User';
      const avatar = data.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=random`;
      
      let textContent = data.text ? `<div>${data.text}</div>` : '';
      let imageContent = data.imageUrl ? `<img src="${data.imageUrl}" class="chat-image">` : '';
      let audioContent = data.audioUrl ? `<audio controls src="${data.audioUrl}"></audio>` : '';
      let timeFormatted = formatTime(data.createdAt);

      let reaction = data.reaction ? `<div class="reactions-bar"><span class="reaction-badge">${data.reaction}</span></div>` : '';

      wrapper.innerHTML = `
        <img src="${avatar}" class="avatar">
        <div class="message-content">
          <span class="sender-name">${name}</span>
          <div class="message-row">
            <div class="message">
              ${textContent}${imageContent}${audioContent}
              <div class="msg-timestamp">${timeFormatted}</div>
              ${reaction}
            </div>
          </div>
        </div>`;

      const msgRow = wrapper.querySelector('.message-row');
      const msgBubble = wrapper.querySelector('.message');

      // Reaction Picker on click
      msgBubble.onclick = async () => {
        const chosenEmoji = prompt("React to message (e.g. ❤️, 👍, 😂, 🔥):");
        if (chosenEmoji && docId && !isLocal) {
          try {
            await updateDoc(doc(db, "messages", docId), { reaction: chosenEmoji });
          } catch(e) { console.error(e); }
        }
      };

      if ((isMe || data.uid === "ai_bot_123") && docId) {
        const delBtn = document.createElement('button');
        delBtn.className = 'action-icon'; delBtn.innerHTML = '🗑️';
        delBtn.onclick = async (e) => {
          e.stopPropagation();
          if (confirm("Delete message?")) {
             if (isLocal) {
                 let localMsgs = JSON.parse(localStorage.getItem('bot_messages') || '[]');
                 localMsgs = localMsgs.filter(m => m.id !== docId);
                 localStorage.setItem('bot_messages', JSON.stringify(localMsgs));
                 loadLocalBotMessages(); 
             } else {
                 await deleteDoc(doc(db, "messages", docId));
             }
          }
        };
        msgRow.appendChild(delBtn);
      }

      chatMessages.appendChild(wrapper);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function loadLocalBotMessages() {
        const chatMessages = document.getElementById('chat-messages');
        chatMessages.innerHTML = '';
        const localMsgs = JSON.parse(localStorage.getItem('bot_messages') || '[]');
        localMsgs.forEach(msg => appendMessageToUI(msg, msg.id, true));
    }

    function loadMessages() {
      if (unsubscribeMessages) unsubscribeMessages();
      const q = query(collection(db, "messages"), orderBy("createdAt", "asc"));
      let firstLoad = true;

      unsubscribeMessages = onSnapshot(q, (snapshot) => {
        document.getElementById('chat-messages').innerHTML = '';
        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          if ((data.room || 'global') === currentRoom) appendMessageToUI(data, docSnap.id, false);
        });

        // Play sound when new incoming message arrives
        if (!firstLoad && snapshot.docChanges().some(change => change.type === 'added')) {
          soundEffect.play().catch(() => {});
        }
        firstLoad = false;
      });
      listenForIncomingCalls();
    }

    // Chat Message Form Handler
    document.getElementById('chat-form').onsubmit = async (e) => {
      e.preventDefault();
      let text = messageInput.value.trim();
      emojiPicker.style.display = 'none';
      if (!text) return;

      // BAD WORD FILTER
      badWords.forEach(word => {
        const reg = new RegExp(word, 'gi');
        text = text.replace(reg, '***');
      });

      if (currentRoom === 'bot') {
          const userMsg = { id: Date.now().toString(), text: text, imageUrl: null, audioUrl: null, uid: currentUser.uid, name: currentUser.displayName || "User", photoURL: currentUser.photoURL || "", room: "bot", createdAt: Date.now() };
          let localMsgs = JSON.parse(localStorage.getItem('bot_messages') || '[]');
          localMsgs.push(userMsg);
          localStorage.setItem('bot_messages', JSON.stringify(localMsgs));
          loadLocalBotMessages();

          const botReply = brain[text.toLowerCase()] || "That sounds interesting!";
          setTimeout(() => {
              const botMsg = { id: (Date.now() + 1).toString(), text: botReply, imageUrl: null, audioUrl: null, uid: "ai_bot_123", name: "AI Bot", photoURL: "https://ui-avatars.com/api/?name=Bot&background=0D8ABC&color=fff", room: "bot", createdAt: Date.now() + 1000 };
              let msgs = JSON.parse(localStorage.getItem('bot_messages') || '[]');
              msgs.push(botMsg);
              localStorage.setItem('bot_messages', JSON.stringify(msgs));
              loadLocalBotMessages();
          }, 1000);
      } else {
          await addDoc(collection(db, "messages"), {
            text: text, imageUrl: null, audioUrl: null,
            uid: currentUser.uid, name: currentUser.displayName || "User", photoURL: currentUser.photoURL || "", room: currentRoom, createdAt: serverTimestamp()
          });
      }
      messageInput.value = '';
    };

    // --- VOICE RECORDING LOGIC ---
    let mediaRecorder; let audioChunks = []; let isRecording = false; const micBtn = document.getElementById('mic-btn');
    micBtn.onclick = async () => {
        if (!isRecording) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                let mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
                mediaRecorder = new MediaRecorder(stream, { mimeType });
                audioChunks = [];

                mediaRecorder.start();
                isRecording = true; micBtn.innerText = "🛑"; micBtn.classList.add("recording");
                messageInput.placeholder = "Recording..."; messageInput.disabled = true;

                mediaRecorder.addEventListener("dataavailable", e => { if (e.data.size > 0) audioChunks.push(e.data); });
                mediaRecorder.addEventListener("stop", async () => {
                    messageInput.placeholder = "Uploading audio...";
                    const audioBlob = new Blob(audioChunks, { type: mimeType });
                    const audioRef = ref(storage, 'chat_audio/' + currentUser.uid + '_' + Date.now() + (mimeType.includes('mp4') ? '.mp4' : '.webm'));
                    try {
                        await uploadBytes(audioRef, audioBlob); 
                        const audioUrl = await getDownloadURL(audioRef);
                        await addDoc(collection(db, "messages"), { text: "", imageUrl: null, audioUrl: audioUrl, uid: currentUser.uid, name: currentUser.displayName || "User", photoURL: currentUser.photoURL || "", room: currentRoom, createdAt: serverTimestamp() });
                    } catch (e) { alert("Audio error: " + e.message); } 
                    finally { messageInput.placeholder = "Type a message..."; messageInput.disabled = false; stream.getTracks().forEach(t => t.stop()); }
                });
            } catch(e) { alert("Microphone access needed."); }
        } else {
            if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
            isRecording = false; micBtn.innerText = "🎤"; micBtn.classList.remove("recording");
        }
    };
  </script>
</body>
</html>
