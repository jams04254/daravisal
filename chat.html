<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chat Pro</title>
  <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1/index.js"></script>
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    body { background-color: #e5e5f7; display: flex; justify-content: center; align-items: center; width: 100vw; height: 100vh; height: 100dvh; overflow: hidden; position: fixed; }

    /* Modals */
    .modal-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; padding: 15px; }
    .modal-box { background: #fff; padding: 20px; border-radius: 12px; width: 100%; max-width: 380px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; }
    .modal-box h2 { margin-bottom: 15px; color: #333; font-size: 20px; }
    .auth-form { display: flex; flex-direction: column; gap: 12px; }
    .auth-form input { padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; width: 100%; }
    .btn { padding: 10px; border-radius: 8px; font-size: 15px; font-weight: bold; cursor: pointer; border: none; width: 100%; }
    .btn-primary { background: #007bff; color: white; }
    .btn-secondary { background: #e9ecef; color: #333; margin-top: 8px; }
    .google-btn { background: #4285F4; color: white; margin-top: 10px; }
    .toggle-text { margin-top: 12px; font-size: 13px; color: #555; }
    .toggle-text span { color: #007bff; cursor: pointer; font-weight: bold; }
    
    #profile-preview { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin: 10px auto; display: block; border: 2px solid #007bff; }

    /* Chat Container */
    .chat-container { width: 100vw; height: 100vh; height: 100dvh; background: white; display: flex; flex-direction: column; position: relative; overflow: hidden; }

    @media (min-width: 768px) {
      .chat-container { max-width: 650px; height: 90vh; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
    }

    /* Header & Top Navigation Bar */
    .chat-header { background: #007bff; color: white; padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; z-index: 10; flex-shrink: 0; }
    .header-top-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; }
    
    /* Search Bar Area */
    .search-container { position: relative; flex: 1; max-width: 180px; }
    #user-search { width: 100%; padding: 5px 10px; border-radius: 20px; border: none; outline: none; font-size: 13px; }
    .search-results { position: absolute; top: 32px; left: 0; background: white; width: 100%; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.2); max-height: 150px; overflow-y: auto; display: none; flex-direction: column; color: black; z-index: 100; }
    .search-item { display: flex; align-items: center; gap: 8px; padding: 8px; border-bottom: 1px solid #eee; cursor: pointer; }
    .search-item img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; }
    .search-item:hover { background: #f8f9fa; }

    .chat-info { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: bold; }
    #remove-friend-btn { background: rgba(255, 255, 255, 0.2); border: 1px solid white; color: white; padding: 2px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; display: none; }
    #remove-friend-btn:hover { background: rgba(255, 0, 0, 0.3); }
    
    /* Friends Top Menu Bar */
    .friends-bar { display: flex; align-items: center; gap: 6px; overflow-x: auto; padding-bottom: 2px; width: 100%; scrollbar-width: none; }
    .friends-bar::-webkit-scrollbar { display: none; }
    .friend-chip { position: relative; display: flex; align-items: center; gap: 6px; background: rgba(255, 255, 255, 0.2); padding: 3px 8px; border-radius: 20px; cursor: pointer; font-size: 12px; white-space: nowrap; transition: background 0.2s; border: 1px solid transparent; }
    .friend-chip:hover, .friend-chip.active { background: white; color: #007bff; font-weight: bold; }
    .friend-chip img { width: 18px; height: 18px; border-radius: 50%; object-fit: cover; }
    
    /* Notification dot badge */
    .notification-dot { position: absolute; top: -2px; right: -2px; width: 8px; height: 8px; background-color: #ff3b30; border-radius: 50%; border: 2px solid #007bff; display: none; }

    /* User Profile & Logout */
    .user-profile { display: flex; align-items: center; cursor: pointer; }
    .user-profile img { width: 26px; height: 26px; border-radius: 50%; object-fit: cover; border: 1px solid white; }
    #logout-btn { background: transparent; color: white; border: 1px solid white; padding: 2px 6px; border-radius: 4px; cursor: pointer; font-size: 11px; }

    /* Messages Area */
    .chat-messages { flex: 1 1 auto; padding: 10px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background: #f8f9fa; -webkit-overflow-scrolling: touch; min-height: 0; }
    .message-wrapper { display: flex; gap: 8px; max-width: 88%; }
    .message-wrapper img.avatar { width: 26px; height: 26px; border-radius: 50%; align-self: flex-end; object-fit: cover; }
    .message-content { display: flex; flex-direction: column; }
    .sender-name { font-size: 10px; color: #666; margin-bottom: 2px; }
    .message { padding: 8px 12px; border-radius: 12px; word-wrap: break-word; font-size: 14px; }
    .message img.chat-image { max-width: 100%; border-radius: 8px; margin-top: 4px; display: block; }
    
    .delete-icon { background: none; border: none; font-size: 13px; cursor: pointer; opacity: 0.5; padding: 4px; }
    .delete-icon:hover { opacity: 1; color: red; }

    .message-wrapper.sent { align-self: flex-end; flex-direction: row-reverse; }
    .message-wrapper.sent .message { background: #007bff; color: white; border-bottom-right-radius: 2px; }
    .message-wrapper.sent .sender-name { display: none; }
    .message-wrapper.received { align-self: flex-start; }
    .message-wrapper.received .message { background: #e9ecef; color: black; border-bottom-left-radius: 2px; }
    .message-row { display: flex; align-items: center; gap: 4px; }
    .message-wrapper.sent .message-row { flex-direction: row-reverse; }

    /* Input Area */
    .chat-input-area { display: flex; padding: 6px 10px; background: white; border-top: 1px solid #ddd; align-items: center; gap: 6px; position: relative; flex-shrink: 0; width: 100%; }
    .chat-input-area input[type="text"] { flex: 1; padding: 8px 12px; border: 1px solid #ccc; border-radius: 20px; outline: none; font-size: 14px; min-width: 0; }
    .icon-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: #555; padding: 2px; }
    .send-btn { background: #007bff; color: white; border: none; padding: 8px 14px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 13px; }
    
    emoji-picker { position: absolute; bottom: 50px; left: 5px; z-index: 100; max-width: 95vw; height: 240px; }
  </style>
</head>
<body>

  <!-- Login / Register Screen -->
  <div id="auth-screen" class="modal-screen">
    <div class="modal-box">
      <h2 id="auth-title">Login</h2>
      <form id="login-form" class="auth-form">
        <input type="email" id="login-email" placeholder="Email" required>
        <input type="password" id="login-password" placeholder="Password" required>
        <button type="submit" class="btn btn-primary">Log In</button>
      </form>
      <form id="register-form" class="auth-form" style="display: none;">
        <input type="text" id="reg-name" placeholder="Your Name" required>
        <input type="email" id="reg-email" placeholder="Email" required>
        <input type="password" id="reg-password" placeholder="Password (min 6 chars)" required minlength="6">
        <button type="submit" class="btn btn-primary">Register</button>
      </form>
      <button id="google-btn" class="btn google-btn">Sign in with Google</button>
      <div class="toggle-text" id="toggle-to-register">Don't have an account? <span>Register here</span></div>
      <div class="toggle-text" id="toggle-to-login" style="display: none;">Already have an account? <span>Log in</span></div>
    </div>
  </div>

  <!-- Profile Screen -->
  <div id="profile-modal" class="modal-screen" style="display: none;">
    <div class="modal-box">
      <h2>Edit Profile</h2>
      <img id="profile-preview" src="https://via.placeholder.com/100?text=+" alt="Preview">
      <input type="file" id="profile-upload" accept="image/*" style="display: none;">
      <button class="btn btn-primary" onclick="document.getElementById('profile-upload').click()">Choose Picture</button>
      <button id="save-profile-btn" class="btn btn-primary" style="display: none; margin-top: 10px;">Save Profile</button>
      <button id="close-profile-btn" class="btn btn-secondary">Close</button>
    </div>
  </div>

  <!-- Chat UI -->
  <div class="chat-container">
    <header class="chat-header">
      <div class="header-top-row">
        <div class="search-container">
          <input type="text" id="user-search" placeholder="🔍 Search & Add...">
          <div id="search-results" class="search-results"></div>
        </div>

        <div class="chat-info">
          <span id="room-label">Global Chat</span>
          <button id="remove-friend-btn">❌ Remove Friend</button>
        </div>
        
        <div style="display: flex; gap: 6px; align-items: center;">
          <div id="user-profile" class="user-profile" style="display: none;" title="Profile">
            <img id="user-pic" src="" alt="Profile">
          </div>
          <button id="logout-btn" style="display:none;">Logout</button>
        </div>
      </div>

      <!-- Top Menu Friends Bar -->
      <div class="friends-bar" id="friends-bar">
        <div class="friend-chip active" id="chip-global" onclick="switchRoom('global', 'Global Chat')">
          🌐 Global
          <span class="notification-dot" id="dot-global"></span>
        </div>
      </div>
    </header>

    <main class="chat-messages" id="chat-messages"></main>

    <form class="chat-input-area" id="chat-form">
      <label for="chat-image-upload" class="icon-btn" title="Send image">📎</label>
      <input type="file" id="chat-image-upload" accept="image/*" style="display: none;">
      <button type="button" id="emoji-btn" class="icon-btn">😀</button>
      <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
      <button type="submit" class="send-btn">Send</button>
    </form>
    
    <emoji-picker id="emoji-picker" style="display: none;"></emoji-picker>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, serverTimestamp, doc, setDoc, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB1Dbs7G-G-Gt5xCLNM9FDb9Wqsy_1tRT4",
      authDomain: "visal-eaeea.firebaseapp.com",
      projectId: "visal-eaeea",
      storageBucket: "visal-eaeea.firebasestorage.app",
      messagingSenderId: "77752028345",
      appId: "1:77752028345:web:81c423c896b0701bfc9f68",
      measurementId: "G-H2DBRZ8R8X"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const storage = getStorage(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let unsubscribeMessages = null;
    let globalUnsubscribeNotification = null;
    let currentRoom = 'global';

    document.getElementById('toggle-to-register').onclick = () => {
      document.getElementById('login-form').style.display = 'none';
      document.getElementById('toggle-to-register').style.display = 'none';
      document.getElementById('register-form').style.display = 'flex';
      document.getElementById('toggle-to-login').style.display = 'block';
      document.getElementById('auth-title').innerText = "Create Account";
    };
    document.getElementById('toggle-to-login').onclick = () => {
      document.getElementById('register-form').style.display = 'none';
      document.getElementById('toggle-to-login').style.display = 'none';
      document.getElementById('login-form').style.display = 'flex';
      document.getElementById('toggle-to-register').style.display = 'block';
      document.getElementById('auth-title').innerText = "Login";
    };

    document.getElementById('register-form').onsubmit = async (e) => {
      e.preventDefault();
      try {
        const res = await createUserWithEmailAndPassword(auth, document.getElementById('reg-email').value, document.getElementById('reg-password').value);
        await updateProfile(res.user, { displayName: document.getElementById('reg-name').value });
        await saveUserToDatabase(res.user);
      } catch (error) { alert("Registration Error: " + error.message); }
    };

    document.getElementById('login-form').onsubmit = async (e) => {
      e.preventDefault();
      try {
        await signInWithEmailAndPassword(auth, document.getElementById('login-email').value, document.getElementById('login-password').value);
      } catch (error) { alert("Login Error: " + error.message); }
    };

    document.getElementById('google-btn').onclick = async () => {
      try {
        const res = await signInWithPopup(auth, provider);
        await saveUserToDatabase(res.user);
      } catch (error) { alert("Google Sign-In Error: " + error.message); }
    };

    document.getElementById('logout-btn').onclick = () => {
      if (confirm("Log out?")) signOut(auth);
    };

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('logout-btn').style.display = 'block';
        document.getElementById('user-profile').style.display = 'flex';
        await saveUserToDatabase(user);
        updateUserUI(user);
        loadFriendsBar();
        loadMessages();
        listenToAllNotifications();
      } else {
        currentUser = null;
        document.getElementById('auth-screen').style.display = 'flex';
        document.getElementById('logout-btn').style.display = 'none';
        document.getElementById('user-profile').style.display = 'none';
        if (unsubscribeMessages) unsubscribeMessages();
        if (globalUnsubscribeNotification) globalUnsubscribeNotification();
      }
    });

    async function saveUserToDatabase(user) {
      try {
        await setDoc(doc(db, "users", user.uid), {
          uid: user.uid,
          name: user.displayName || "User",
          email: user.email,
          photoURL: user.photoURL || ""
        }, { merge: true });
      } catch (err) { console.error("Error saving user profile:", err); }
    }

    function updateUserUI(user) {
      document.getElementById('user-pic').src = user.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.displayName || "User")}&background=random`;
    }

    document.getElementById('user-profile').onclick = () => {
      document.getElementById('profile-preview').src = currentUser.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(currentUser.displayName || "User")}&background=random`;
      document.getElementById('profile-modal').style.display = 'flex';
    };
    document.getElementById('close-profile-btn').onclick = () => {
      document.getElementById('profile-modal').style.display = 'none';
      document.getElementById('save-profile-btn').style.display = 'none';
    };

    let profileFile = null;
    document.getElementById('profile-upload').onchange = (e) => {
      profileFile = e.target.files[0];
      if (profileFile) {
        document.getElementById('profile-preview').src = URL.createObjectURL(profileFile);
        document.getElementById('save-profile-btn').style.display = 'block';
      }
    };

    document.getElementById('save-profile-btn').onclick = async () => {
      if (!profileFile) return;
      try {
        const imgRef = ref(storage, 'profiles/' + currentUser.uid + '_' + Date.now());
        await uploadBytes(imgRef, profileFile);
        const url = await getDownloadURL(imgRef);
        await updateProfile(currentUser, { photoURL: url });
        await saveUserToDatabase(currentUser);
        updateUserUI(currentUser);
        document.getElementById('profile-modal').style.display = 'none';
        document.getElementById('save-profile-btn').style.display = 'none';
        profileFile = null;
        alert("Profile picture updated!");
      } catch (err) { alert("Save Error: " + err.message); }
    };

    const searchInput = document.getElementById('user-search');
    const searchResults = document.getElementById('search-results');

    searchInput.oninput = async (e) => {
      const val = e.target.value.toLowerCase().trim();
      if (!val) { searchResults.style.display = 'none'; return; }
      
      try {
        const snap = await getDocs(collection(db, "users"));
        searchResults.innerHTML = '';
        let matches = 0;

        snap.forEach(docSnap => {
          const u = docSnap.data();
          if (u.uid !== currentUser.uid && u.name.toLowerCase().includes(val)) {
            matches++;
            const div = document.createElement('div');
            div.className = 'search-item';
            const pic = u.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(u.name)}&background=random`;
            div.innerHTML = `<img src="${pic}"><span>${u.name} (Add)</span>`;
            
            div.onclick = () => {
              const storageKey = 'chat_friends_' + currentUser.uid;
              let localFriends = JSON.parse(localStorage.getItem(storageKey) || '[]');
              
              if (!localFriends.some(f => f.uid === u.uid)) {
                localFriends.push({
                  uid: u.uid,
                  name: u.name,
                  photoURL: u.photoURL || ""
                });
                localStorage.setItem(storageKey, JSON.stringify(localFriends));
              }

              searchResults.style.display = 'none';
              searchInput.value = '';
              loadFriendsBar();
              switchRoom([currentUser.uid, u.uid].sort().join('_'), u.name);
            };
            searchResults.appendChild(div);
          }
        });
        searchResults.style.display = matches > 0 ? 'flex' : 'none';
      } catch (err) {
        console.error("Search error:", err);
      }
    };

    document.onclick = (e) => {
      if (e.target !== searchInput && !searchResults.contains(e.target)) {
        searchResults.style.display = 'none';
      }
    };

    function loadFriendsBar() {
      const bar = document.getElementById('friends-bar');
      bar.innerHTML = `
        <div class="friend-chip ${currentRoom === 'global' ? 'active' : ''}" id="chip-global" onclick="switchRoom('global', 'Global Chat')">
          🌐 Global
          <span class="notification-dot" id="dot-global"></span>
        </div>
      `;

      if (!currentUser) return;

      try {
        const storageKey = 'chat_friends_' + currentUser.uid;
        let localFriends = JSON.parse(localStorage.getItem(storageKey) || '[]');
        
        localFriends.forEach(f => {
          const roomId = [currentUser.uid, f.uid].sort().join('_');
          const pic = f.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(f.name)}&background=random`;
          
          const chip = document.createElement('div');
          chip.className = `friend-chip ${currentRoom === roomId ? 'active' : ''}`;
          chip.id = `chip-${roomId}`;
          chip.innerHTML = `<img src="${pic}"><span>${f.name}</span><span class="notification-dot" id="dot-${roomId}"></span>`;
          chip.onclick = () => switchRoom(roomId, f.name);
          bar.appendChild(chip);
        });
      } catch (err) { console.error("Error loading local friends:", err); }
    }

    window.switchRoom = function(roomId, roomName) {
      currentRoom = roomId;
      document.getElementById('room-label').innerText = roomName;
      
      const removeBtn = document.getElementById('remove-friend-btn');
      if (roomId === 'global') {
        removeBtn.style.display = 'none';
      } else {
        removeBtn.style.display = 'inline-block';
      }

      const dot = document.getElementById(`dot-${roomId}`);
      if (dot) dot.style.display = 'none';

      document.querySelectorAll('.friend-chip').forEach(c => c.classList.remove('active'));
      const activeChip = document.getElementById(roomId === 'global' ? 'chip-global' : `chip-${roomId}`);
      if (activeChip) activeChip.classList.add('active');

      loadMessages();
    };

    document.getElementById('remove-friend-btn').onclick = () => {
      if (currentRoom === 'global') return;
      if (confirm("Remove this friend from your device?")) {
        const storageKey = 'chat_friends_' + currentUser.uid;
        let localFriends = JSON.parse(localStorage.getItem(storageKey) || '[]');
        const friendId = currentRoom.split('_').find(id => id !== currentUser.uid);
        
        localFriends = localFriends.filter(f => f.uid !== friendId);
        localStorage.setItem(storageKey, JSON.stringify(localFriends));

        switchRoom('global', 'Global Chat');
        loadFriendsBar();
      }
    };

    function listenToAllNotifications() {
      if (globalUnsubscribeNotification) globalUnsubscribeNotification();

      const q = query(collection(db, "messages"), orderBy("createdAt", "desc"));
      globalUnsubscribeNotification = onSnapshot(q, (snapshot) => {
        snapshot.docChanges().forEach((change) => {
          if (change.type === "added") {
            const data = change.doc.data();
            const msgRoom = data.room || 'global';
            
            if (data.uid !== currentUser.uid && msgRoom !== currentRoom) {
              const dot = document.getElementById(`dot-${msgRoom}`);
              if (dot) {
                dot.style.display = 'block';
              }
            }
          }
        });
      });
    }

    const messageInput = document.getElementById('message-input');
    let chatFile = document.getElementById('chat-image-upload');
    let selectedChatFile = null;

    chatFile.onchange = (e) => {
      selectedChatFile = e.target.files[0];
      if (selectedChatFile) messageInput.placeholder = `Attached: ${selectedChatFile.name}`;
    };

    document.getElementById('emoji-btn').onclick = () => {
      const picker = document.getElementById('emoji-picker');
      picker.style.display = picker.style.display === 'none' ? 'block' : 'none';
    };
    document.getElementById('emoji-picker').addEventListener('emoji-click', e => {
      messageInput.value += e.detail.unicode;
    });

    document.getElementById('chat-form').onsubmit = async (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      if (!text && !selectedChatFile) return;

      document.getElementById('emoji-picker').style.display = 'none';
      let imageUrl = null;

      try {
        if (selectedChatFile) {
          const imgRef = ref(storage, 'chat_images/' + Date.now() + '_' + selectedChatFile.name);
          await uploadBytes(imgRef, selectedChatFile);
          imageUrl = await getDownloadURL(imgRef);
        }

        await addDoc(collection(db, "messages"), {
          text: text,
          imageUrl: imageUrl,
          uid: currentUser.uid,
          name: currentUser.displayName || "User",
          photoURL: currentUser.photoURL || "",
          room: currentRoom,
          createdAt: serverTimestamp()
        });

        messageInput.value = '';
        messageInput.placeholder = "Type a message...";
        selectedChatFile = null;
        chatFile.value = '';
      } catch (err) { alert("Error sending message: " + err.message); }
    };

    function loadMessages() {
      if (unsubscribeMessages) unsubscribeMessages();

      const q = query(collection(db, "messages"), orderBy("createdAt", "asc"));
      const chatMessages = document.getElementById('chat-messages');

      unsubscribeMessages = onSnapshot(q, (snapshot) => {
        chatMessages.innerHTML = '';
        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          if ((data.room || 'global') !== currentRoom) return;

          const isMe = data.uid === currentUser.uid;
          const wrapper = document.createElement('div');
          wrapper.className = `message-wrapper ${isMe ? 'sent' : 'received'}`;

          const name = data.name || 'User';
          const avatar = data.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=random`;
          
          let textContent = data.text ? `<div>${data.text}</div>` : '';
          let imageContent = data.imageUrl ? `<img src="${data.imageUrl}" class="chat-image" onclick="window.open('${data.imageUrl}', '_blank')">` : '';

          wrapper.innerHTML = `
            <img src="${avatar}" class="avatar">
            <div class="message-content">
              <span class="sender-name">${name}</span>
              <div class="message-row">
                <div class="message">${textContent}${imageContent}</div>
              </div>
            </div>
          `;

          if (isMe) {
            const delBtn = document.createElement('button');
            delBtn.className = 'delete-icon';
            delBtn.innerHTML = '🗑️';
            delBtn.onclick = async () => {
              if (confirm("Delete message?")) await deleteDoc(doc(db, "messages", docSnap.id));
            };
            wrapper.querySelector('.message-row').appendChild(delBtn);
          }

          chatMessages.appendChild(wrapper);
        });
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }, (error) => {
        console.error("Error loading messages:", error);
      });
    }
  </script>
</body>
</html>
