<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenAI AI Chat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f7f7f8;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #e5e5e5;
        }

        .header {
            background: #10a37f;
            color: white;
            padding: 16px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.25rem;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .chat-history {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background-color: #ffffff;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background-color: #10a37f;
            color: white;
            border-bottom-right-radius: 2px;
        }

        .message.assistant {
            align-self: flex-start;
            background-color: #f0f0f0;
            color: #202124;
            border-bottom-left-radius: 2px;
        }

        .message.error {
            align-self: center;
            background-color: #fde8e8;
            color: #9b1c1c;
            border: 1px solid #f8b4b4;
            font-size: 0.85rem;
        }

        .input-area {
            padding: 16px;
            border-top: 1px solid #e5e5e5;
            display: flex;
            gap: 10px;
            background: #ffffff;
        }

        .input-area textarea {
            flex: 1;
            padding: 12px;
            border: 1px solid #d9d9e3;
            border-radius: 8px;
            resize: none;
            height: 48px;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
        }

        .input-area textarea:focus {
            border-color: #10a37f;
        }

        .input-area button {
            background-color: #10a37f;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .input-area button:hover {
            background-color: #0e8e6d;
        }

        .input-area button:disabled {
            background-color: #c5c5d2;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        <h1>OpenAI Chat Assistant</h1>
        <p>Powered by GPT-4o Mini</p>
    </div>

    <div class="chat-history" id="chatHistory">
        <div class="message assistant">Hello! I am your AI assistant powered by OpenAI. How can I help you today?</div>
    </div>

    <div class="input-area">
        <textarea id="userInput" placeholder="Type your message here..." rows="1"></textarea>
        <button id="sendBtn">Send</button>
    </div>
</div>

<script>
    // Embedded OpenAI API Key
    const OPENAI_API_KEY = "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";

    const chatHistory = document.getElementById('chatHistory');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    // System prompt & conversation context
    let conversationHistory = [
        { role: "system", content: "You are a helpful, friendly AI assistant." }
    ];

    async function sendMessage() {
        const messageText = userInput.value.trim();

        if (!messageText) return;

        // 1. Add User Message to UI & Memory
        appendMessage(messageText, 'user');
        conversationHistory.push({ role: "user", content: messageText });

        userInput.value = '';
        sendBtn.disabled = true;

        // 2. Add loading state to UI
        const loadingDiv = appendMessage("Thinking...", 'assistant');

        try {
            // 3. Request completion from OpenAI Chat API
            const response = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${OPENAI_API_KEY}`
                },
                body: JSON.stringify({
                    model: "gpt-4o-mini",
                    messages: conversationHistory
                })
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error?.message || "Failed to call OpenAI API.");
            }

            const data = await response.json();
            const aiResponseText = data.choices[0].message.content;

            // 4. Update UI with response
            loadingDiv.textContent = aiResponseText;

            // 5. Add AI Message to Memory
            conversationHistory.push({ role: "assistant", content: aiResponseText });

        } catch (error) {
            console.error(error);
            loadingDiv.textContent = `Error: ${error.message}`;
            loadingDiv.classList.add('error');
        } finally {
            sendBtn.disabled = false;
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }
    }

    function appendMessage(text, role) {
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('message', role);
        messageDiv.textContent = text;
        chatHistory.appendChild(messageDiv);
        chatHistory.scrollTop = chatHistory.scrollHeight;
        return messageDiv;
    }

    sendBtn.addEventListener('click', sendMessage);

    userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
</script>

</body>
</html>
