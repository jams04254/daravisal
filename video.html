<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google AI Studio Chat</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: #1a73e8;
            color: white;
            padding: 18px;
            text-align: center;
        }

        .header h1 {
            font-size: 1.3rem;
        }

        .chat-history {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background-color: #1a73e8;
            color: white;
            border-bottom-right-radius: 2px;
        }

        .message.model {
            align-self: flex-start;
            background-color: #f1f3f4;
            color: #202124;
            border-bottom-left-radius: 2px;
        }

        .message.error {
            align-self: center;
            background-color: #fce8e6;
            color: #c5221f;
            border: 1px solid #fad2cf;
            font-size: 0.85rem;
        }

        .input-area {
            padding: 16px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
            background: #ffffff;
        }

        .input-area textarea {
            flex: 1;
            padding: 12px;
            border: 1px solid #dadce0;
            border-radius: 8px;
            resize: none;
            height: 48px;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
        }

        .input-area textarea:focus {
            border-color: #1a73e8;
        }

        .input-area button {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .input-area button:hover {
            background-color: #1557b0;
        }

        .input-area button:disabled {
            background-color: #bdc1c6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        <h1>Google AI Studio Chat</h1>
    </div>

    <div class="chat-history" id="chatHistory">
        <div class="message model">Hello! Ask me anything to get started.</div>
    </div>

    <div class="input-area">
        <textarea id="userInput" placeholder="Type your message here..." rows="1"></textarea>
        <button id="sendBtn">Send</button>
    </div>
</div>

<script>
    // 🔑 PASTE YOUR GOOGLE AI STUDIO API KEY HERE (Starts with AIzaSy...)
    const GOOGLE_API_KEY = "AQ.Ab8RN6IUG-_iENiMXoXMZQ_1_ZLTFJks7QHNGUy2OW-ytZ1Y4A";

    const chatHistory = document.getElementById('chatHistory');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');

    let conversationHistory = [];

    async function sendMessage() {
        const messageText = userInput.value.trim();

        if (!GOOGLE_API_KEY || GOOGLE_API_KEY === "PASTE_YOUR_GOOGLE_AI_STUDIO_KEY_HERE") {
            alert("Please edit index.html and replace 'PASTE_YOUR_GOOGLE_AI_STUDIO_KEY_HERE' with your actual Google AI Studio key.");
            return;
        }

        if (!messageText) return;

        // 1. Render User Message
        appendMessage(messageText, 'user');
        conversationHistory.push({
            role: "user",
            parts: [{ text: messageText }]
        });

        userInput.value = '';
        sendBtn.disabled = true;

        // 2. Render Loading State
        const loadingMessageDiv = appendMessage("Thinking...", 'model');

        try {
            // 3. Call Google AI Studio Gemini API
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GOOGLE_API_KEY}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    contents: conversationHistory
                })
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error?.message || "Failed to communicate with Google AI API.");
            }

            const data = await response.json();
            const aiResponseText = data.candidates[0].content.parts[0].text;

            // 4. Update UI
            loadingMessageDiv.textContent = aiResponseText;

            // 5. Update Conversation History
            conversationHistory.push({
                role: "model",
                parts: [{ text: aiResponseText }]
            });

        } catch (error) {
            console.error(error);
            loadingMessageDiv.textContent = `Error: ${error.message}`;
            loadingMessageDiv.classList.add('error');
        } finally {
            sendBtn.disabled = false;
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }
    }

    function appendMessage(text, role) {
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('message', role);
        messageDiv.textContent = text;
        chatHistory.appendChild(messageDiv);
        chatHistory.scrollTop = chatHistory.scrollHeight;
        return messageDiv;
    }

    sendBtn.addEventListener('click', sendMessage);

    userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
</script>

</body>
</html>
