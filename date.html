<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic HTML Calendar</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f7f6;
        }

        .calendar-container {
            width: 350px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .calendar-header {
            background-color: #007bff;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .calendar-header h2 {
            font-size: 1.5rem;
            font-weight: 600;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            padding: 15px;
            text-align: center;
        }

        .day-name {
            font-weight: bold;
            color: #6c757d;
            padding-bottom: 10px;
            font-size: 0.9rem;
        }

        .calendar-day {
            padding: 12px 0;
            font-size: 0.95rem;
            color: #333;
            cursor: pointer;
            border-radius: 5px;
            transition: background 0.2s;
        }

        .calendar-day:hover:not(.empty) {
            background-color: #e9ecef;
        }

        /* Highlights the current date today */
        .calendar-day.today {
            background-color: #007bff;
            color: white;
            font-weight: bold;
        }

        .empty {
            cursor: default;
        }
    </style>
</head>
<body>

    <div class="calendar-container">
        <div class="calendar-header">
            <h2 id="month-year-display"></h2>
        </div>
        <div class="calendar-grid" id="calendar-days-grid">
            <!-- Weekday Headers -->
            <div class="day-name">Sun</div>
            <div class="day-name">Mon</div>
            <div class="day-name">Tue</div>
            <div class="day-name">Wed</div>
            <div class="day-name">Thu</div>
            <div class="day-name">Fri</div>
            <div class="day-name">Sat</div>
            <!-- Dynamic Date Cells Will Inject Here -->
        </div>
    </div>

    <script>
        function generateCalendar() {
            const display = document.getElementById("month-year-display");
            const grid = document.getElementById("calendar-days-grid");
            
            const today = new Date();
            const currentYear = today.getFullYear();
            const currentMonth = today.getMonth(); // 0-indexed (Jan = 0)
            const currentDate = today.getDate();

            // Month list array for heading
            const months = [
                "January", "February", "March", "April", "May", "June", 
                "July", "August", "September", "October", "November", "December"
            ];

            // Set the month and year header text
            display.innerText = `${months[currentMonth]} ${currentYear}`;

            // Get day index of the 1st of the month (0 = Sun, 1 = Mon, etc.)
            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();

            // Get total days in current month
            const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

            // 1. Add blank spaces to pad grid before day 1 starts
            for (let i = 0; i < firstDayIndex; i++) {
                const emptyCell = document.createElement("div");
                emptyCell.classList.add("calendar-day", "empty");
                grid.appendChild(emptyCell);
            }

            // 2. Loop through and add all the numerical dates
            for (let day = 1; day <= totalDays; day++) {
                const dayCell = document.createElement("div");
                dayCell.classList.add("calendar-day");
                dayCell.innerText = day;

                // Mark today's exact date with a visual class highlight
                if (day === currentDate) {
                    dayCell.classList.add("today");
                }

                grid.appendChild(dayCell);
            }
        }

        // Run calendar initialization on page load
        generateCalendar();
    </script>
</body>
</html>
