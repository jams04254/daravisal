<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Popup with Spinner</title>
    <style>
        /* Base Website Style */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }

        /* The button you click */
        .open-btn {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            background-color: #2c3e50;
            color: white;
            border: none;
            border-radius: 5px;
        }

        /* Popup Background */
        .modal {
            display: none; 
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background-color: rgba(0, 0, 0, 0.85); 
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        /* The Website Container (Made much bigger!) */
        .modal-content {
            position: relative;
            background: #fff;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 90vw;  /* Takes up 90% of screen width */
            height: 90vh; /* Takes up 90% of screen height */
            overflow: hidden; /* Keeps the website inside the rounded corners */
        }

        /* The Close Button */
        .close-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            width: 40px;
            height: 40px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1001;
        }

        .close-btn:hover { background-color: #c0392b; }

        /* Your Exact Spinner Code */
        .spinner {
            width: 50px;
            height: 50px;
            border: 6px solid #e5e5e5;
            border-top: 6px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite; 
            position: absolute; /* Keeps spinner in the exact center */
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Main button -->
    <button id="openBtn" class="open-btn">Open Website</button>

    <!-- Popup Window -->
    <div id="websiteModal" class="modal">
        <div class="modal-content">
            
            <!-- Close Button -->
            <button id="closeBtn" class="close-btn">X</button>

            <!-- The Spinner -->
            <div id="spinner" class="spinner"></div>

            <!-- The Website Iframe -->
            <iframe 
                id="websiteFrame" 
                style="display: none; border: none;" 
                width="100%" 
                height="100%" 
                src="" 
                onload="document.getElementById('spinner').style.display='none'; this.style.display='block';">
            </iframe>

        </div>
    </div>

    <!-- JavaScript -->
    <script>
        const openBtn = document.getElementById('openBtn');
        const closeBtn = document.getElementById('closeBtn');
        const modal = document.getElementById('websiteModal');
        const frame = document.getElementById('websiteFrame');
        const spinner = document.getElementById('spinner');

        openBtn.onclick = function() {
            modal.style.display = 'flex'; 
            spinner.style.display = 'block'; 
            frame.style.display = 'none'; 
            
            // Try changing this link! (But remember, YouTube.com and Google.com will block it)
            frame.src = "https://en.wikipedia.org/"; 
        }

        closeBtn.onclick = function() {
            modal.style.display = 'none'; 
            frame.src = ""; // Clears the website when closed
        }
    </script>

</body>
</html>
