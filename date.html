<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time-Based Background</title>
    <style>
        /* Base styles for smooth transition */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            transition: background 1s ease, color 1s ease;
        }

        /* Night theme (6 PM to 5:59 AM) */
        body.night {
            background-color: #000000;
            color: #ffffff;
        }

        /* Day theme (6 AM to 5:59 PM) */
        body.day {
            background-color: #f0f2f5;
            color: #333333;
        }

        .container {
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="greeting">Loading...</h1>
        <p id="clock"></p>
    </div>

    <script>
        function updateTheme() {
            const now = new Date();
            const hours = now.getHours();
            const body = document.body;
            const greeting = document.getElementById('greeting');
            const clock = document.getElementById('clock');

            // Format clock text
            clock.innerText = now.toLocaleTimeString();

            // Check time: Morning to Evening (6 AM - 5 PM / 06:00 - 17:59)
            if (hours >= 6 && hours < 18) {
                body.className = 'day';
                greeting.innerText = 'Good Day! Light Background Active.';
            } else {
                body.className = 'night';
                greeting.innerText = 'Good Night! Black Background Active.';
            }
        }

        // Run immediately on page load
        updateTheme();

        // Update every second to keep clock accurate and handle time changes
        setInterval(updateTheme, 1000);
    </script>
</body>
</html>
