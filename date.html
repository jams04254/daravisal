<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Calendar</title>
    <style>
        .calendar-container {
            font-family: Arial, sans-serif;
            max-width: 400px;
            margin: 20px auto;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .calendar-header {
            background-color: #007bff;
            color: white;
            text-align: center;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
        }
        table {
            width: 100%;
            border-collapse: collapse; /* Merges borders */
        }
        th, td {
            text-align: center;
            padding: 12px;
            width: 14.28%; /* Equal column sizing */
        }
        th {
            background-color: #f1f1f1;
            color: #333;
            font-size: 0.9rem;
        }
        td {
            cursor: pointer;
            border: 1px solid #eaeaea;
        }
        td:hover {
            background-color: #e0f0ff;
        }
        .today {
            background-color: #007bff;
            color: white;
            font-weight: bold;
            border-radius: 4px;
        }
        .empty-day {
            background-color: #fafafa;
            cursor: default;
        }
    </style>
</head>
<body>

<div class="calendar-container">
    <div class="calendar-header">August 2026</div>
    <table>
        <thead>
            <tr>
                <th>Sun</th>
                <th>Mon</th>
                <th>Tue</th>
                <th>Wed</th>
                <th>Thu</th>
                <th>Fri</th>
                <th>Sat</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <!-- Empty cells for days belonging to the previous month -->
                <td class="empty-day"></td>
                <td class="empty-day"></td>
                <td class="empty-day"></td>
                <td class="empty-day"></td>
                <td class="empty-day"></td>
                <td class="empty-day"></td>
                <td class="today">1</td>
            </tr>
            <tr>
                <td>2</td>
                <td>3</td>
                <td>4</td>
                <td>5</td>
                <td>6</td>
                <td>7</td>
                <td>8</td>
            </tr>
            <tr>
                <td>9</td>
                <td>10</td>
                <td>11</td>
                <td>12</td>
                <td>13</td>
                <td>14</td>
                <td>15</td>
            </tr>
            <tr>
                <td>16</td>
                <td>17</td>
                <td>18</td>
                <td>19</td>
                <td>20</td>
                <td>21</td>
                <td>22</td>
            </tr>
            <tr>
                <td>23</td>
                <td>24</td>
                <td>25</td>
                <td>26</td>
                <td>27</td>
                <td>28</td>
                <td>29</td>
            </tr>
            <tr>
                <td>30</td>
                <td>31</td>
                <td class="empty-day"></td>
                <td class="empty-day"></td>
                <td class="empty-day"></td>
                <td class="empty-day"></td>
                <td class="empty-day"></td>
            </tr>
        </tbody>
    </table>
</div>

</body>
</html>
